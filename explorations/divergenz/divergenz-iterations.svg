<text x="1392" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#161616" text-anchor="end">01 — SIX STUDIES</text>
<text x="48" y="107" font-family="Helvetica, Arial, sans-serif" font-size="48" fill="#161616" letter-spacing="-1.8">Split, not return.</text>
<text x="48" y="139" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#79776f" >One shared body. Two directions. The D remains a secondary reading.</text>
