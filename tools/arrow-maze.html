<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Arrow Maze — parametric generator</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; display: flex; background: #e9e7e2; }
  #panel { width: 264px; margin: 16px; padding: 14px 18px; background: #fff; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0,0,0,.15); box-sizing: border-box; flex-shrink: 0;
           align-self: flex-start; max-height: calc(100vh - 32px); overflow-y: auto; }
  #panel label { display: grid; grid-template-columns: 100px 1fr 38px; align-items: center; margin: 10px 0; gap: 6px; }
  #panel label span:first-child { color: #444; }
  #panel input[type=range] { width: 100%; min-width: 0; margin: 0; }
  #panel input[type=color], #panel select, #panel input[type=checkbox] { justify-self: end; grid-column: 2 / 4; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; }
  #stage { flex: 1; display: flex; overflow: auto; padding: 32px; }
  #stage svg { display: block; margin: auto; flex-shrink: 0; box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  #panel input[type=number] { width: 58px; box-sizing: border-box; font: inherit; }
  #panel input[type=text] { grid-column: 2 / 4; width: 100%; box-sizing: border-box; font: inherit; }
  #panel #nodes span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stage [data-node] { cursor: move; }
  #layers .layer { margin: 8px 0; }
  #layers .layer div { display: flex; align-items: center; gap: 6px; }
  #layers .layer div + div { margin-top: 3px; }
  #layers .layer b { flex: 1; font-weight: 500; color: #444; }
  #layers button { font: inherit; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; padding: 0 5px; }
  #layers input[type=range] { flex: 1; min-width: 0; margin: 0; }
  #layers select { font: inherit; }
  #masters .tile { display: flex; align-items: center; gap: 6px; margin: 5px 0; padding: 3px 4px; border-radius: 6px; }
  #masters .tile.active { background: #eef; outline: 1px solid #3b82f6; }
  #masters .tile input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid #ccc; border-radius: 4px; flex-shrink: 0; }
  #masters .tile input[type=text] { flex: 1; min-width: 0; font: inherit; border: none; background: none; padding: 0; }
  #masters .tile .name { flex: 1; color: #444; }
  #masters .tile small { color: #888; font-variant-numeric: tabular-nums; }
  #masters button { font: inherit; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; padding: 0 5px; }
  #masters .tile.active button.pick { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  #masters p { margin: 2px 0 6px; color: #888; font-size: 11px; }
  #viewbox { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px;
             background: #fff; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  #viewbox span { color: #444; }
  #viewbox select { font: inherit; padding: 3px 6px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns a { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; background: #3b82f6; color: #fff; text-decoration: none; cursor: pointer; }
  .btns select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  #panel details { border-top: 1px solid #eee; }
  #panel details > label:last-child { margin-bottom: 12px; }
  #panel summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between;
                   padding: 7px 0; color: #888; font: 600 11px/1 system-ui; letter-spacing: .07em; text-transform: uppercase; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "+"; font-size: 13px; }
  #panel details[open] summary::after { content: "\2212"; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="mobile.css">
<body>
<div id="panel">
  <h1>Arrow Maze</h1>
  <div id="controls"></div>
  <div class="btns">
    <select id="fmt" title="file type"></select>
    <a id="dl">⬇ export</a>
    <a id="dldir" title="choose export folder">📁 …</a>
  </div>
</div>
<div id="stage"></div>
<div id="viewbox">
  <span>view</span>
  <select id="zoom">
    <option value="fit">scale to fit</option>
    <option>10%</option><option>25%</option><option>50%</option><option>75%</option>
    <option>100%</option><option>150%</option><option>200%</option>
  </select>
</div>
<script src="export.js"></script>
<script src="zoom.js"></script>
<script src="mobile.js"></script>
<script src="sliders.js"></script>
<script src="snapshots.js"></script>
<script src="fontpick.js"></script>
<script src="opentype.min.js"></script>
<script>
// ---------- parameters ----------
// A ["", "group", …] row opens a new collapsible section; rows after it land in it.
const DEFS = [
  ["", "group", {label: "arrows"}],
  ["seed",   "range", {min: 1, max: 9999, step: 1, value: 42, hint: "every other setting equal, the same seed gives the same picture"}],
  ["cols",   "range", {min: 2, max: 60, step: 1, value: 12, label: "columns", hint: "the grid across the width — fewer columns, bigger arrows"}],
  ["amount", "range", {min: 5, max: 100, step: 5, value: 100, label: "arrow amount %", hint: "share of the grid seeded with arrows — 100 packs it full, every step down removes arrows evenly"}],
  ["length", "range", {min: 1, max: 80, step: 1, value: 14, label: "max length", hint: "cells per arrow, drawn between 3 and this"}],
  ["turn",   "range", {min: 0, max: 100, step: 5, value: 30, label: "bend chance %", hint: "chance to bend at each cell once the straight run is done"}],
  ["run",    "range", {min: 1, max: 6, step: 1, value: 2, label: "min straight", hint: "cells to go straight between bends"}],
  ["dirs",   "select", {options: ["mixed", "orthogonal", "diagonal"], value: "mixed", label: "bend angles", hint: "orthogonal: 90° only — diagonal: 45° only"}],
  ["fork",   "range", {min: 0, max: 100, step: 5, value: 30, label: "fork chance %", hint: "chance an arrow grows a second branch"}],
  ["bleed",  "range", {min: 0, max: 100, step: 5, value: 30, label: "edge bleed %", hint: "chance an arrow on a border cell starts off the edge"}],
  ["cross",  "range", {min: 0, max: 100, step: 5, value: 0, label: "cross panels %", hint: "chance an arrow from a paper panel ignores the panel edges — set ring colour to home panel so it keeps a paper gap where it crosses ink"}],
  ["dots",   "range", {min: 0, max: 12, step: 1, value: 1, label: "filler dots", hint: "at most this many discs in holes the arrows left"}],
  ["", "group", {label: "geometry"}],
  ["shaft",  "range", {min: 10, max: 98, step: 1, value: 77, label: "shaft % cell", hint: "the rest of the cell is spacing — contours take their room from the shaft"}],
  ["headW",  "range", {min: 60, max: 400, step: 5, value: 200, label: "head width %", hint: "of the shaft width"}],
  ["headL",  "range", {min: 30, max: 400, step: 5, value: 130, label: "head length %", hint: "of the shaft width"}],
  ["round",  "range", {min: 0, max: 100, step: 5, value: 50, label: "rounded bends %", hint: "share of bends drawn as arcs instead of sharp corners"}],
  ["radius", "range", {min: 10, max: 100, step: 5, value: 100, label: "bend radius %", hint: "of a cell, for rounded bends"}],
  ["mix",    "select", {options: ["per arrow", "per bend"], value: "per arrow", label: "rounding mix", hint: "decide round or sharp once per arrow, or at every bend"}],
  ["arcs",   "range", {min: 0, max: 100, step: 5, value: 40, label: "wide arcs %", hint: "chance a 90° bend sweeps a quarter circle several cells wide"}],
  ["arcR",   "range", {min: 1, max: 6, step: 1, value: 3, label: "arc radius", hint: "in cells, the widest sweep"}],
  ["uturn",  "range", {min: 0, max: 100, step: 5, value: 0, label: "u-turn %", hint: "chance a straight run ends in a 180° sweep back — hairpins, S- and P-shapes"}],
  ["big",    "range", {min: 0, max: 100, step: 5, value: 0, label: "big arrows %", hint: "chance an arrow draws at the large scale: a wider lane walked in coarser steps"}],
  ["bigk",   "range", {min: 1.5, max: 4, step: 0.5, value: 2, label: "big scale ×", hint: "lane width of the large arrows, in cells of the base grid"}],
  ["vary",   "range", {min: 0, max: 80, step: 5, value: 30, label: "shaft taper %", hint: "how much the shaft thins along alternate runs"}],
  ["", "group", {label: "panels"}],
  ["panels", "range", {min: 1, max: 32, step: 1, value: 4, label: "panel amount", hint: "number of nested panel subdivisions"}],
  ["invert", "range", {min: 0, max: 100, step: 5, value: 40, label: "inverted %", hint: "share of panels drawn paper-on-ink"}],
  ["line",   "range", {min: 0, max: 12, step: 0.5, value: 3, label: "divider px"}],
  ["", "group", {label: "text"}],
  ["words",  "text",  {value: "", label: "words", hint: "entries split on | — a / inside an entry breaks it into fixed lines"}],
  ["textmin","range", {min: 10, max: 100, step: 5, value: 40, label: "shrink to %", hint: "how small a word may go to find a pocket"}],
  ["tgap",   "range", {min: 0, max: 100, step: 5, value: 15, label: "text gap % cell", hint: "breathing room the arrows keep around the words — 0 lets them almost touch"}],
  ["tblock", "checkbox", {value: true, label: "text clears arrows", hint: "the words claim their ground before the arrows walk — untick and the arrows run beneath, the text simply overlays them (with flip per panel the letters invert against whatever they cross)"}],
  ["weight", "range", {min: 100, max: 900, step: 100, value: 700, label: "weight"}],
  ["aweight","range", {min: 100, max: 900, step: 100, value: 400, label: "accent weight", hint: "weight of words set in the accent face"}],
  ["textcol","select", {options: ["home panel", "flip per panel"], value: "home panel", label: "word colour", hint: "flip per panel: letters invert against the true ground beneath them — panels, arrows and dots alike — like white type under a difference filter"}],
  ["", "group", {label: "layers"}],
  ["", "group", {label: "colour"}],
  ["ringcol","select", {options: ["ring masters", "home panel"], value: "ring masters", label: "ring colour", hint: "home panel: rings take the arrow's own panel ground, so they only show where it crosses onto another panel"}],
  ["hollow", "range", {min: 0, max: 100, step: 5, value: 0, label: "hollow %", hint: "chance an arrow is drawn as ground fill with a counter-colour contour — signage-style outline arrows"}],
  ["cwidth", "range", {min: 0, max: 16, step: 0.5, value: 4, label: "arrow contour", hint: "px per ring around the arrows"}],
  ["tcwidth","range", {min: 0, max: 16, step: 0.5, value: 4, label: "text contour", hint: "px per ring around the words"}],
  ["steps",  "range", {min: 1, max: 8, step: 1, value: 4, label: "contour rings"}],
  ["", "group", {label: "motion"}],
  ["motion", "select", {options: ["none", "draw in", "draw loop"], value: "none", label: "motion"}],
  ["speed",  "range", {min: 0.5, max: 20, step: 0.5, value: 3, label: "cycle sec"}],
  ["hold",   "range", {min: 0, max: 90, step: 5, value: 35, label: "hold %", hint: "share of the cycle the finished picture stays"}],
  ["stagger","range", {min: 0, max: 100, step: 5, value: 50, label: "stagger %", hint: "how far apart the arrows start"}],
  ["timing", "select", {options: ["ease out", "linear", "snap"], value: "ease out", label: "timing"}],
  ["", "group", {label: "export"}],
  ["outline","checkbox", {value: true, label: "outline words", hint: "render words as vector paths so the SVG needs no font (Paper, print); needs the faces re-parsed, uploads only"}],
  ["fps",    "range", {min: 5, max: 30, step: 1, value: 20, label: "gif fps"}],
  ["gifpx",  "range", {min: 200, max: 1000, step: 50, value: 600, label: "gif px"}]
];
const p = {};
const saved = JSON.parse(localStorage.getItem("arrow-maze") || "{}");
// Carry the short-lived across/down controls back into the nested panel amount.
if (!("panels" in saved) && ("panelCols" in saved || "panelRows" in saved))
  saved.panels = Math.min(32, Math.max(1, (saved.panelCols || 1) * (saved.panelRows || 1)));
const controls = document.getElementById("controls");

// ---------- collapsible groups ----------
// Native <details>: no toggle state machine, and open/closed rides along in the
// same saved blob as every other parameter.
p.open = saved.open || {};
let cur = controls;
const groups = {};
const group = name => cur = groups[name] ??= (() => {
  const d = document.createElement("details");
  d.open = p.open[name] ?? name === "arrows";
  d.innerHTML = `<summary>${name}</summary>`;
  d.addEventListener("toggle", () => {
    p.open[name] = d.open;
    localStorage.setItem("arrow-maze", JSON.stringify(p));
  });
  controls.append(d);
  return d;
})();

// ---------- artboard size (exact pixels) ----------
p.wpx = +saved.wpx || 1500;
p.hpx = +saved.hpx || 2000;
p.margin = +saved.margin || 0;
{
  const wIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.wpx});
  const hIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.hpx});
  const preset = document.createElement("select");
  for (const o of ["custom", "2:3", "3:4", "4:5", "1:1", "9:16", "16:9"]) preset.append(new Option(o, o));
  const swap = Object.assign(document.createElement("button"), {textContent: "⇄", title: "swap width/height"});
  swap.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  p.lock = saved.lock ?? false;
  const lock = Object.assign(document.createElement("button"), {title: "lock aspect ratio"});
  lock.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  const drawLock = () => { lock.textContent = p.lock ? "🔒" : "🔓"; lock.style.background = p.lock ? "#eef" : "#fff"; };
  drawLock();
  lock.addEventListener("click", () => { p.lock = !p.lock; drawLock(); localStorage.setItem("arrow-maze", JSON.stringify(p)); });

  const sizeRow = document.createElement("label");
  sizeRow.style.cssText = "display:flex;justify-content:space-between;align-items:center";
  sizeRow.innerHTML = "<span>artboard px</span>";
  const sizeBox = document.createElement("span");
  sizeBox.style.cssText = "display:flex;align-items:center;gap:4px";
  sizeBox.append(wIn, "×", hIn, lock);
  sizeRow.append(sizeBox);

  const presetRow = document.createElement("label");
  presetRow.innerHTML = "<span>aspect</span>";
  const presetBox = document.createElement("span");
  presetBox.style.cssText = "display:flex;align-items:center;gap:6px;grid-column:2/4;justify-self:end";
  presetBox.append(preset, swap);
  presetRow.append(presetBox);

  let ratio = p.hpx / p.wpx;                     // locked aspect, frozen at lock time
  lock.addEventListener("click", () => { if (p.lock) ratio = p.hpx / p.wpx; });
  const apply = soft => {
    p.wpx = Math.max(100, Math.min(8000, +wIn.value || p.wpx));
    p.hpx = Math.max(100, Math.min(8000, +hIn.value || p.hpx));
    if (!soft) { wIn.value = p.wpx; hIn.value = p.hpx; ratio = p.hpx / p.wpx; }
    render();                                    // render() persists — saves on every keystroke
  };
  const onEdit = (src, other, factor) => soft => {
    if (p.lock) other.value = Math.round((+src.value || 100) * factor());
    else preset.value = "custom";
    apply(soft);
  };
  const wEdit = onEdit(wIn, hIn, () => ratio), hEdit = onEdit(hIn, wIn, () => 1 / ratio);
  wIn.addEventListener("input", () => wEdit(true));    // live: saves while typing, no clamp-fight
  wIn.addEventListener("change", () => wEdit(false));  // commit: normalize the field
  hIn.addEventListener("input", () => hEdit(true));
  hIn.addEventListener("change", () => hEdit(false));
  preset.addEventListener("input", () => {
    if (preset.value === "custom") return;
    const [a, b] = preset.value.split(":").map(Number);
    hIn.value = Math.round(p.wpx * b / a);   // width is the anchor
    apply();
  });
  swap.addEventListener("click", () => {
    [wIn.value, hIn.value] = [hIn.value, wIn.value];
    preset.value = "custom";
    apply();
  });
  const mIn = Object.assign(document.createElement("input"), {type: "number", min: 0, max: 4000, value: p.margin});
  const marginRow = document.createElement("label");
  marginRow.innerHTML = "<span>margin px</span>";
  marginRow.append(mIn);
  mIn.addEventListener("input", () => { p.margin = Math.max(0, +mIn.value || 0); render(); });
  group("artboard").append(sizeRow, presetRow, marginRow);
}

for (const [key, type, opt] of DEFS) {
  if (type === "group") { group(opt.label); continue; }
  p[key] = key in saved ? saved[key] : opt.value;
  const label = document.createElement("label");
  const name = document.createElement("span");
  name.textContent = opt.label || key;
  if (opt.hint) label.title = opt.hint;
  label.append(name);
  let input;
  if (type === "select") {
    input = document.createElement("select");
    for (const o of opt.options) input.append(new Option(o, o, o === p[key], o === p[key]));
  } else {
    input = document.createElement("input");
    input.type = type;
    if (type === "range") { Object.assign(input, {min: opt.min, max: opt.max, step: opt.step}); input.dataset.def = opt.value; }
    if (type === "checkbox") input.checked = p[key]; else input.value = p[key];
    if (type === "text") input.placeholder = "one | two | three";
  }
  label.append(input);
  let out;
  if (type === "range") { out = document.createElement("output"); out.value = p[key]; label.append(out); }
  input.addEventListener("input", () => {
    p[key] = type === "checkbox" ? input.checked : type === "range" ? +input.value : input.value;
    if (out) out.value = input.value;
    render();
  });
  cur.append(label);
}
group("snapshots").append(snapshotPanel());

// custom typeface for the words — FontFace renders it live, and the data: URL
// is embedded as an @font-face in the SVG so exports keep the face
// opentype.js parses each uploaded face so "outline words" can bake real glyph
// paths — the exported SVG then renders identically with no font installed
const OT = {main: null, accent: null};
async function parseOT(slot, f) {
  OT[slot] = null;
  if (f?.dataURL) try {
    OT[slot] = opentype.parse(await (await fetch(f.dataURL)).arrayBuffer());
  } catch (e) { console.warn("cannot outline " + slot + " face:", e.message); }
  render();
}
const userFont = fontPicker({onChange: f => parseOT("main", f)});
// a second face (say, a light italic) for single words — the toggle per entry
const accentFont = fontPicker({label: "accent face", key: "font:" + SLUG + ":accent", onChange: f => parseOT("accent", f)});
// one size slider per entry; position is auto until the entry is dragged on the stage
const entries = () => p.words.split("|").map(s => s.trim()).filter(Boolean);
p.nodes = saved.nodes || {};                          // text → {size: % cell, x, y: fraction of the artboard or null}
const nodeRows = Object.assign(document.createElement("div"), {id: "nodes"});
let rowsKey;
function syncNodeRows() {
  const es = entries(), key = es.join("|");
  if (key === rowsKey) return;
  rowsKey = key;
  for (const k in p.nodes) if (!es.includes(k)) delete p.nodes[k];
  nodeRows.innerHTML = "";
  for (const t of es) {
    const nd = p.nodes[t] ??= {size: 60, x: null, y: null};
    const label = document.createElement("label"), name = document.createElement("span");
    label.style.gridTemplateColumns = "92px 1fr 30px 16px";   // room for the accent toggle
    name.textContent = t;
    name.title = "size % cell — drag the words on the stage to place them, double-click to snap back";
    const input = Object.assign(document.createElement("input"), {type: "range", min: 20, max: 300, step: 5, value: nd.size});
    input.dataset.def = 60;
    const out = document.createElement("output");
    out.value = nd.size;
    input.addEventListener("input", () => { nd.size = +input.value; out.value = input.value; render(); });
    const acc = Object.assign(document.createElement("input"), {type: "checkbox", checked: !!nd.acc,
      title: "set this word in the accent face"});
    acc.style.cssText = "justify-self:end;grid-column:auto";
    acc.addEventListener("input", () => { nd.acc = acc.checked; render(); });
    label.append(name, input, out, acc);
    nodeRows.append(label);
  }
}
group("text").append(nodeRows, userFont.row, accentFont.row);

// ---------- layers: order (bottom first), visibility, opacity, blend ----------
const LAYERS = ["paper", "panels", "arrows", "dots", "text"];
const BLENDS = ["normal", "multiply", "screen", "overlay", "difference"];
p.layers = (saved.layers || []).filter(l => LAYERS.includes(l.id));
for (const id of LAYERS) if (!p.layers.some(l => l.id === id)) p.layers.push({id, on: true, opacity: 100, blend: "normal"});
const layerBox = Object.assign(document.createElement("div"), {id: "layers"});
function buildLayers() {
  layerBox.innerHTML = "";
  [...p.layers].reverse().forEach(l => {              // top layer listed first, like any layers panel
    const i = p.layers.indexOf(l);
    const row = Object.assign(document.createElement("div"), {className: "layer"});
    const on = Object.assign(document.createElement("input"), {type: "checkbox", checked: l.on, title: "visible"});
    on.addEventListener("input", () => { l.on = on.checked; render(); });
    const name = Object.assign(document.createElement("b"), {textContent: l.id});
    const mv = (d, t) => {
      const b = Object.assign(document.createElement("button"), {textContent: t, title: d > 0 ? "raise" : "lower"});
      b.addEventListener("click", () => {
        const j = i + d;
        if (j < 0 || j >= p.layers.length) return;
        [p.layers[i], p.layers[j]] = [p.layers[j], p.layers[i]];
        buildLayers(); render();
      });
      return b;
    };
    const op = Object.assign(document.createElement("input"), {type: "range", min: 0, max: 100, step: 5, value: l.opacity, title: "opacity %"});
    op.dataset.def = 100;
    const out = document.createElement("output");
    out.value = l.opacity;
    op.addEventListener("input", () => { l.opacity = +op.value; out.value = op.value; render(); });
    const bl = document.createElement("select");
    bl.title = "blend mode";
    for (const b of BLENDS) bl.append(new Option(b, b, b === l.blend, b === l.blend));
    bl.addEventListener("input", () => { l.blend = bl.value; render(); });
    const head = document.createElement("div"), ctl = document.createElement("div");
    head.append(on, name, mv(1, "\u25B2"), mv(-1, "\u25BC"));
    ctl.append(op, out, bl);
    row.append(head, ctl);
    layerBox.append(row);
  });
}
buildLayers();
group("layers").append(layerBox);

// ---------- colour masters ----------
// A master is a named swatch. The built-ins are what everything uses by
// default (ink/paper by panel polarity, arrow fill, the ring pair for contours); any master
// can also be pinned to single elements: press its "pick" button, then click
// arrows, words, panels, dots or the dividers on the stage. Assignments are
// keyed by element: words by their text, arrows/panels/dots by index.
// ponytail: arrow and dot indices shift when the seed or grid changes — those pins then land on other arrows

    const runLen = (k, dir) => { let j = k; do j += dir; while (j > 0 && j < pts.length - 1 && !bendAt(j)); return Math.hypot(pts[j][0] - pts[k][0], pts[j][1] - pts[k][1]); };
    if (ext) { line(tail, pts[0]); cur = pts[0]; }   // the lead-in is its own straight segment, so a first-step arc starts where it was claimed
    for (let k = 1; k < pts.length; k++) {
      sAt[k - 1] = L;
      const P = pts[k], nx = pts[k + 1];
      if (A.arcs[k]) {                                   // sweeping step: a quarter or half circle from cur to P
        const ao = A.arcs[k];
        arc(cur, unit0(D[A.dirs[k - 1]]), ao.sg, ao.r * cell, ao.th, P);
        cur = P;
        continue;
      }
      if (nx && !A.arcs[k + 1]) {
        const u1 = unit(cur, P), u2 = unit(P, nx);
        const cross = u1[0] * u2[1] - u1[1] * u2[0];
        if (Math.abs(cross) > 1e-9 && A.bends[k] && r0 > 0) {
          const th = Math.atan2(Math.abs(cross), u1[0] * u2[0] + u1[1] * u2[1]), tan = Math.tan(th / 2);
          const r = Math.min(r0A, runLen(k, -1) / 2 / tan, runLen(k, 1) / 2 / tan);
          const t = r * tan, sg = Math.sign(cross);
          const a = [P[0] - u1[0] * t, P[1] - u1[1] * t], b = [P[0] + u2[0] * t, P[1] + u2[1] * t];
          line(cur, a);
          arc(a, u1, sg, r, th, b);
          cur = b;
          continue;
        }
      }
      line(cur, P); cur = P;
    }
    sAt[pts.length - 1] = L;
    const poseAt = rr => {                                 // position + heading (rad) at fraction rr of the centreline
      const s = clamp(rr, 0, 1) * L;
      const g = segs.find(g => s <= g.s0 + g.len) || segs[segs.length - 1], ds = s - g.s0;
      if (g.u) return [g.a[0] + g.u[0] * ds, g.a[1] + g.u[1] * ds, Math.atan2(g.u[1], g.u[0])];
      const ang = g.a0 + g.sg * ds / g.r;
      return [g.c[0] + g.r * Math.cos(ang), g.c[1] + g.r * Math.sin(ang), ang + g.sg * Math.PI / 2];
    };
    const pose = rr => { const [x, y, a] = poseAt(rr); return `translate(${f(x)} ${f(y)}) rotate(${f(a * 180 / Math.PI)})`; };

    // head in the motion frame (base on the origin, tip along +x), with a tab back
    // into the shaft so the seam never shows
    // shaft as a filled outline: each straight run has one width, runs alternate
    // full / thinner starting full, and the width switches only at angled bends,
    // where the two runs' offset edges cross (a square junction for 90°); arcs
    // and the runs after them keep the width they came in with
    let w = swA, k = 0;
    const same = (g, h) => g.u && h.u && g.u[0] * h.u[0] + g.u[1] * h.u[1] > 1 - 1e-6;
    const wid = segs.map((g, i) => {
      const prev = segs[i - 1];
      if (g.u && prev && prev.u && !same(g, prev)) w = ++k % 2 ? swA * (1 - A.dip * (0.6 + 0.4 * rnd3())) : swA;
      return w;
    });
    const st = [];                                             // stations: x, y, tangent, width
    segs.forEach((g, i) => {
      const wv = wid[i];
      if (g.u) st.push([g.a[0], g.a[1], g.u[0], g.u[1], wv], [g.a[0] + g.u[0] * g.len, g.a[1] + g.u[1] * g.len, g.u[0], g.u[1], wv]);
      else {
        const n = Math.ceil(g.len / (0.1 * cell));
        for (let j = 0; j <= n; j++) {
          const ds = g.len * j / n, ang = g.a0 + g.sg * ds / g.r;
          st.push([g.c[0] + g.r * Math.cos(ang), g.c[1] + g.r * Math.sin(ang), -g.sg * Math.sin(ang), g.sg * Math.cos(ang), wv]);
        }
      }
    });
    const left = [], right = [];
    for (let i = 0; i < st.length; i++) {
      const [x, y, tx, ty, w] = st[i];
      let ox = -ty * w / 2, oy = tx * w / 2;                   // offset to the left edge
      const nxt = st[i + 1];
      if (nxt && Math.hypot(nxt[0] - x, nxt[1] - y) < 1e-6) {   // joint: two tangents (and widths) at one point
        const n1 = [-ty, tx], n2 = [-nxt[3], nxt[2]], c = n1[0] * n2[0] + n1[1] * n2[1], d1 = w / 2, d2 = nxt[4] / 2;
        if (Math.abs(c) < 0.999) {                             // corner: where the two offset edges cross
          const q = 1 - c * c;
          ox = (d1 * (n1[0] - n2[0] * c) + d2 * (n2[0] - n1[0] * c)) / q;
          oy = (d1 * (n1[1] - n2[1] * c) + d2 * (n2[1] - n1[1] * c)) / q;
        }
        i++;
      }
      let lx = x + ox, ly = y + oy, rx = x - ox, ry = y - oy;
      if (i === 0 && A.fork) {                                 // a branch's tail is cut along the parent's centreline, so
        const [vx, vy] = unit0(D[arrows[A.fork.id].dirs[A.fork.k]]);   // both corners (and their rings) stay inside the parent
        const dot = -ox * vy + oy * vx, den = -tx * vy + ty * vx;      // offsets and tangent against the parent's normal
        if (Math.abs(den) > 1e-6) { lx -= tx * dot / den; ly -= ty * dot / den; rx += tx * dot / den; ry += ty * dot / den; }
      }
      left.push(`${f(lx)} ${f(ly)}`);
      right.push(`${f(rx)} ${f(ry)}`);
    }
    const outline = `M${left.join("L")}L${right.reverse().join("L")}Z`;

    const col = colorOf("arrow:" + i, A.hollow ? home : p.arrow), tab = f(Math.min(swA / 2, hwpA));
    const headD = `M0 ${f(hwpA)} L${f(hlpA)} 0 L0 ${f(-hwpA)} L-0.5 ${-tab} L-0.5 ${tab} Z`;
    // phase: on a 1/8 grid for a free arrow; a branch starts the moment its
    // parent's head passes the fork (undoing the easing to find that moment)
    let ph;
    if (A.fork) {
      const P = arrows[A.fork.id], frac = P.sAt[A.fork.k] / P.L, x = p.timing === "ease out" ? 1 - Math.cbrt(1 - frac) : frac;
      ph = P.ph + (loop ? -1 : 1) * m * x;
    } else ph = (p.stagger / 100) * Math.round(rnd4() * 8) / 8;
    A.ph = ph; A.sAt = sAt; A.L = L;
    // the static markup is always the finished arrow (head in place, shaft
    // fully drawn), so the export reads in tools without SMIL; the animations
    // override that in browsers. Dash lengths are absolute (pathLength is not
    // universally honoured) and the head's motion path lives in its own final
    // frame, so a static transform and animateMotion can coexist.
    let headT = pose(1), headAnim = "", mask = "", mk = "";
    if (moving) {
      // the wipe path starts one ring width behind the tail so the mask's butt
      // cap covers the contour's end; the reveal front then lags the head by at
      // most that much, early on, and closes up as it goes
      const g0 = segs[0], u0 = g0.u || [-g0.sg * Math.sin(g0.a0), g0.sg * Math.cos(g0.a0)];
      const back = w1 + (A.fork ? swA / 2 : 0);           // a mitred tail reaches half a shaft further back
      const dm = `M${f(tail[0] - u0[0] * back)} ${f(tail[1] - u0[1] * back)}L` + d.slice(1);
      const Lf = f(L + back + 1);
      let wipe = "", off = 0;
      if (time === null) {
        const tm = smil(ph);
        const [hx, hy, ha] = poseAt(1), c = Math.cos(ha), sn = Math.sin(ha);
        const dl = d.replace(/([MLA])([^MLAZ]*)/g, (m, cmd, args) => {   // the centreline in the head's frame
          const n = args.trim().split(/\s+/).map(Number), dx = n[n.length - 2] - hx, dy = n[n.length - 1] - hy;
          return cmd + n.slice(0, -2).concat([f(c * dx + sn * dy), f(-sn * dx + c * dy)]).join(" ");
        });
        headAnim = `<animateMotion path="${dl}" rotate="auto" keyPoints="${loop ? "0;1;1" : "0;0;1;1"}"${tm}/>`;
        wipe = `<animate attributeName="stroke-dashoffset" values="${loop ? `${Lf};0;0` : `${Lf};${Lf};0;0`}"${tm}/>`;
      } else {
        const r = progress(ph, time);
        headT = pose(r);
        off = f(Lf * (1 - r));
      }
      mk = ` mask="url(#k${i})"`;
      mask = `<mask id="k${i}" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">`
        + `<path d="${dm}" fill="none" stroke="#fff" stroke-width="${f(swA + 2 * w1 + 2)}" stroke-linejoin="miter"`
        + ` stroke-dasharray="${Lf} ${Lf}" stroke-dashoffset="${off}">${wipe}</path></mask>`;
    }
    const headG = inner => `<g transform="${headT}">${headAnim ? `<g>${headAnim}${inner}</g>` : inner}</g>`;
    const cp = A.bleed && !A.cross ? ` clip-path="url(#q${panels.indexOf(A.q)})"` : "";   // a crossing tail runs off the artboard anyway
    if (cp) usedClips.add(panels.indexOf(A.q));
    if (mask) defs.push(mask);
    // static picture: the head bakes into the shaft's path data, so each paint
    // is ONE editable compound path — no transformed groups in the export.
    // The final-pose shape is always built: the words' flip clips against it
    const [hx2, hy2, ha2] = poseAt(1), co = Math.cos(ha2), si = Math.sin(ha2);
    const pt = (x, y) => `${f(hx2 + x * co - y * si)} ${f(hy2 + x * si + y * co)}`;
    const shapeD = outline + `M${pt(0, hwpA)}L${pt(hlpA, 0)}L${pt(0, -hwpA)}L${pt(-0.5, -tab)}L${pt(-0.5, tab)}Z`;
    const shape = moving ? null : shapeD;
    const piece = paint => shape
      ? `<path d="${shape}"${paint}${cp} data-el="arrow:${i}"/>`
      : `<g${cp} data-el="arrow:${i}"><path d="${outline}"${paint}${mk}/>` + headG(`<path d="${headD}"${paint}/>`) + `</g>`;
    A.draw = {
      rings: rings.map(r => piece(` fill="none" stroke="${r.c}" stroke-width="${f(2 * r.w)}" stroke-linejoin="round"`)),
      fill: piece(` fill="${col}"`)
    };
    if (layerOn("arrows")) {
      // tight bbox from the real geometry: shaft edge stations plus head corners,
      // grown by the ring stack — it only gates which words clip against the shape
      let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
      const grow = (x, y, e) => { bx0 = Math.min(bx0, x - e); by0 = Math.min(by0, y - e); bx1 = Math.max(bx1, x + e); by1 = Math.max(by1, y + e); };
      for (const [x, y, , , w] of st) grow(x, y, w / 2 + w1);
      for (const [x, y] of [[0, hwpA], [hlpA, 0], [0, -hwpA]])
        grow(hx2 + x * co - y * si, hy2 + x * si + y * co, w1);
      covers.push({el: `<path d="${shapeD}"${cp}/>`, fill: col, bb: [bx0, by0, bx1, by1]});
    }
  });
  // families: a branch draws inside its parent's group — rings (widest level
  // first) before every fill, so the union still reads as one shape with one
  // contour, and the export groups sanely: one <g> per arrow
  for (const qi of usedClips) defs.push(`<clipPath id="q${qi}">${panels[qi].px}</clipPath>`);
  if (defs.length) LY.arrows.push(`<defs>${defs.join("")}</defs>`);
  const fams = new Map();
  arrows.forEach((A, i) => { if (A.skip) return; const r = A.fork ? A.fork.id : i; fams.has(r) ? fams.get(r).push(i) : fams.set(r, [i]); });
  for (const [r, members] of fams) {
    const ringP = [];
    for (let j = 0; j < pal.length; j++) for (const i of members) if (arrows[i].draw.rings[j]) ringP.push(arrows[i].draw.rings[j]);
    LY.arrows.push(`<g id="arrow-${r}">${ringP.join("")}${members.map(i => arrows[i].draw.fill).join("")}</g>`);
  }
  drawWords();                                         // now that every cover shape is known
  const faces = textUsed ? [userFont.font, accentFont.font].filter(f => f.dataURL)
    .map(f => `@font-face{font-family:"${f.family}";src:url(${f.dataURL});}`).join("") : "";
  const fontDefs = faces ? `<defs><style>${faces}</style></defs>` : "";
  // layers bottom-up in the panel's order; hidden ones are left out entirely
  const layers = p.layers.filter(l => l.on && l.opacity > 0).map(l =>
    `<g id="${l.id}"${l.opacity < 100 ? ` opacity="${l.opacity / 100}"` : ""}${l.blend !== "normal" ? ` style="mix-blend-mode:${l.blend}"` : ""}>${LY[l.id].join("")}</g>`).join("");
  return {w: W, h: H, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${fontDefs}${layers}</svg>`};
}

// ---------- render + export ----------
const stage = document.getElementById("stage");
const zoomEl = document.getElementById("zoom");
p.zoom = saved.zoom === "fit" || typeof saved.zoom === "number" ? saved.zoom : "fit";
let art;
const view = createZoom({
  stage, select: zoomEl, zoom: p.zoom,
  size: () => ({w: art.w, h: art.h}),
  onChange: z => { p.zoom = z; localStorage.setItem("arrow-maze", JSON.stringify(p)); },
});
function render() {
  syncNodeRows();
  localStorage.setItem("arrow-maze", JSON.stringify(p));
  art = makeSVG();
  stage.innerHTML = art.svg;
  view.apply();
}
// drag words on the stage (same pattern as switchboard); a double-tap snaps one
// back to auto — detected on pointerdown, since pointer capture retargets the
// second pointerup (and so dblclick) to the stage
let drag = null, dragged = false, lastTap = 0;
const toArt = e => {
  const r = stage.querySelector("svg").getBoundingClientRect();
  return {x: (e.clientX - r.left) / r.width * art.w, y: (e.clientY - r.top) / r.height * art.h};
};
const nodeOf = e => { const g = e.target.closest("g[data-node]"); return g && {g, nd: p.nodes[entries()[+g.dataset.node]]}; };
stage.addEventListener("pointerdown", e => {
  if (active) {                                      // pinning: the click picks an element for the active master
    const el = e.target.closest("[data-el]");
    if (el && e.button === 0) {
      const key = el.dataset.el.startsWith("word:") ? "word:" + entries()[+el.dataset.el.slice(5)] : el.dataset.el;
      if (p.assign[key] === active) delete p.assign[key]; else p.assign[key] = active;
      buildMasters(); render();
    }
    e.preventDefault();
    return;
  }
  const hit = nodeOf(e);
  if (!hit || e.button !== 0) return;
  e.preventDefault();                                // claim the finger: zoom.js won't pan
  if (e.timeStamp - lastTap < 400) { lastTap = 0; hit.nd.x = hit.nd.y = null; render(); return; }
  lastTap = e.timeStamp;
  const at = toArt(e);
  drag = {...hit, dx: +hit.g.dataset.cx - at.x, dy: +hit.g.dataset.cy - at.y, at};
  dragged = false;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const at = toArt(e);
  if (!dragged && Math.hypot(at.x - drag.at.x, at.y - drag.at.y) < art.w * 0.005) return;   // dead zone: still a click
  dragged = true;
  drag.g.setAttribute("transform", `translate(${(at.x - drag.at.x).toFixed(1)} ${(at.y - drag.at.y).toFixed(1)})`);
});
stage.addEventListener("pointerup", e => {
  if (!drag) return;
  const at = toArt(e), d = drag; drag = null;
  if (!dragged) return;                              // a click leaves the DOM alone so dblclick can fire
  d.nd.x = Math.max(0, Math.min(1, (at.x + d.dx) / art.w));
  d.nd.y = Math.max(0, Math.min(1, (at.y + d.dy) / art.h));
  render();
});
stage.addEventListener("pointercancel", () => { drag = null; });
async function exportGIF(setLabel) {
  const scale = Math.min(1, p.gifpx / Math.max(art.w, art.h));
  const w = Math.round(art.w * scale), h = Math.round(art.h * scale);
  // one full cycle; draw-in also covers the stagger tail. static art = one frame
  const dur = p.motion === "none" ? 0 : p.speed * (p.motion === "draw loop" ? 1
    : 1 + p.stagger / 100 + (p.fork ? Math.max(0.05, 1 - p.hold / 100) : 0));
  const n = dur ? Math.max(1, Math.round(dur * p.fps)) : 1;
  const frames = [];
  try {
    for (let i = 0; i < n; i++) {
      setLabel(`… ${i + 1}/${n}`);
      await new Promise(r => setTimeout(r));           // let the label repaint
      frames.push(await rasterise(makeSVG(i / n * dur).svg, w, h));
    }
    setLabel("… encoding");
    await new Promise(r => setTimeout(r));
    const blob = encodeGIF(frames, {width: w, height: h, delay: Math.max(2, Math.round(100 / p.fps))});
    await saveAs(`arrow-maze-${p.seed}.gif`, blob);
  } finally {
    render();                                          // restore the live SVG
  }
}
// the export drops the stage-only data-* handles so Illustrator sees clean groups
const cleanSVG = svg => svg.replace(/ data-(?:el|node|cx|cy)="[^"]*"/g, "");
wireExport({
  SVG: () => saveAs(`arrow-maze-${p.seed}.svg`, svgBlob(cleanSVG(art.svg))),
  PNG: async () => saveAs(`arrow-maze-${p.seed}.png`, await svgToPNG(art.svg, art.w, art.h)),
  GIF: exportGIF,
});
render();

// self-check: deterministic output for fixed params
console.assert(makeSVG().svg === makeSVG().svg, "generator must be deterministic");
</script>
</body>
</html>
