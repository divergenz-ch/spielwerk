<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Arrow Maze — parametric generator</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; display: flex; background: #e9e7e2; }
  #panel { width: 264px; margin: 16px; padding: 14px 18px; background: #fff; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0,0,0,.15); box-sizing: border-box; flex-shrink: 0;
           align-self: flex-start; max-height: calc(100vh - 32px); overflow-y: auto; }
  #panel label { display: grid; grid-template-columns: 100px 1fr 38px; align-items: center; margin: 10px 0; gap: 6px; }
  #panel label span:first-child { color: #444; }
  #panel input[type=range] { width: 100%; min-width: 0; margin: 0; }
  #panel input[type=color], #panel select, #panel input[type=checkbox] { justify-self: end; grid-column: 2 / 4; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; }
  #stage { flex: 1; display: flex; overflow: auto; padding: 32px; }
  #stage > arrow-maze { display: block; margin: auto; flex-shrink: 0; box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  #stage.responsive { padding: 0; overflow: hidden; }
  #stage.responsive > arrow-maze { width: 100% !important; height: 100% !important; box-shadow: none; }
  #panel input[type=number] { width: 58px; box-sizing: border-box; font: inherit; }
  #panel input[type=text] { grid-column: 2 / 4; width: 100%; box-sizing: border-box; font: inherit; }
  #panel #nodes span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #layers .layer { margin: 8px 0; }
  #layers .layer div { display: flex; align-items: center; gap: 6px; }
  #layers .layer div + div { margin-top: 3px; }
  #layers .layer b { flex: 1; font-weight: 500; color: #444; }
  #layers button { font: inherit; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; padding: 0 5px; }
  #layers input[type=range] { flex: 1; min-width: 0; margin: 0; }
  #layers select { font: inherit; }
  #masters .tile { display: flex; align-items: center; gap: 6px; margin: 5px 0; padding: 3px 4px; border-radius: 6px; }
  #masters .tile.active { background: #eef; outline: 1px solid #3b82f6; }
  #masters .tile input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid #ccc; border-radius: 4px; flex-shrink: 0; }
  #masters .tile input[type=text] { flex: 1; min-width: 0; font: inherit; border: none; background: none; padding: 0; }
  #masters .tile .name { flex: 1; color: #444; }
  #masters .tile small { color: #888; font-variant-numeric: tabular-nums; }
  #masters button { font: inherit; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; padding: 0 5px; }
  #masters .tile.active button.pick { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  #masters p { margin: 2px 0 6px; color: #888; font-size: 11px; }
  #viewbox { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px;
             background: #fff; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  #viewbox span { color: #444; }
  #viewbox select { font: inherit; padding: 3px 6px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns a { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; background: #3b82f6; color: #fff; text-decoration: none; cursor: pointer; }
  .btns select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  #panel details { border-top: 1px solid #eee; }
  #panel details > label:last-child { margin-bottom: 12px; }
  #panel summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between;
                   padding: 7px 0; color: #888; font: 600 11px/1 system-ui; letter-spacing: .07em; text-transform: uppercase; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "+"; font-size: 13px; }
  #panel details[open] summary::after { content: "\2212"; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="mobile.css">
<body>
<div id="panel">
  <h1>Arrow Maze</h1>
  <div id="controls"></div>
  <div class="btns">
    <select id="fmt" title="file type"></select>
    <a id="dl">⬇ export</a>
    <a id="dldir" title="choose export folder">📁 …</a>
  </div>
</div>
<div id="stage"></div>
<div id="viewbox">
  <span>view</span>
  <select id="zoom">
    <option value="fit">scale to fit</option>
    <option>10%</option><option>25%</option><option>50%</option><option>75%</option>
    <option>100%</option><option>150%</option><option>200%</option>
  </select>
</div>
<script src="export.js"></script>
<script src="zoom.js"></script>
<script src="mobile.js"></script>
<script src="sliders.js"></script>
<script src="snapshots.js"></script>
<script src="fontpick.js"></script>
<script src="opentype.min.js"></script>
<script src="p5.min.js"></script>
<script src="arrow-maze.embed.js"></script>
<script>
// ---------- parameters ----------
// DEFS, the layer list and the fixed colours live in arrow-maze.embed.js: the
// tool builds its panel from them, the embed takes its defaults from them.
const {DEFS, LAYERS, BLENDS, FIXED} = ArrowMaze;
const p = {};
const saved = JSON.parse(localStorage.getItem("arrow-maze") || "{}");
// Carry the short-lived across/down controls back into the nested panel amount.
if (!("panels" in saved) && ("panelCols" in saved || "panelRows" in saved))
  saved.panels = Math.min(32, Math.max(1, (saved.panelCols || 1) * (saved.panelRows || 1)));
const controls = document.getElementById("controls");

// ---------- collapsible groups ----------
// Native <details>: no toggle state machine, and open/closed rides along in the
// same saved blob as every other parameter.
p.open = saved.open || {};
let cur = controls;
const groups = {};
const group = name => cur = groups[name] ??= (() => {
  const d = document.createElement("details");
  d.open = p.open[name] ?? name === "arrows";
  d.innerHTML = `<summary>${name}</summary>`;
  d.addEventListener("toggle", () => {
    p.open[name] = d.open;
    localStorage.setItem("arrow-maze", JSON.stringify(p));
  });
  controls.append(d);
  return d;
})();

// ---------- artboard size (exact pixels) ----------
p.wpx = +saved.wpx || 1500;
p.hpx = +saved.hpx || 2000;
p.margin = +saved.margin || 0;
{
  const wIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.wpx});
  const hIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.hpx});
  const preset = document.createElement("select");
  for (const o of ["custom", "2:3", "3:4", "4:5", "1:1", "9:16", "16:9"]) preset.append(new Option(o, o));
  const swap = Object.assign(document.createElement("button"), {textContent: "⇄", title: "swap width/height"});
  swap.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  p.lock = saved.lock ?? false;
  const lock = Object.assign(document.createElement("button"), {title: "lock aspect ratio"});
  lock.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  const drawLock = () => { lock.textContent = p.lock ? "🔒" : "🔓"; lock.style.background = p.lock ? "#eef" : "#fff"; };
  drawLock();
  lock.addEventListener("click", () => { p.lock = !p.lock; drawLock(); localStorage.setItem("arrow-maze", JSON.stringify(p)); });

  const sizeRow = document.createElement("label");
  sizeRow.style.cssText = "display:flex;justify-content:space-between;align-items:center";
  sizeRow.innerHTML = "<span>artboard px</span>";
  const sizeBox = document.createElement("span");
  sizeBox.style.cssText = "display:flex;align-items:center;gap:4px";
  sizeBox.append(wIn, "×", hIn, lock);
  sizeRow.append(sizeBox);

  const presetRow = document.createElement("label");
  presetRow.innerHTML = "<span>aspect</span>";
  const presetBox = document.createElement("span");
  presetBox.style.cssText = "display:flex;align-items:center;gap:6px;grid-column:2/4;justify-self:end";
  presetBox.append(preset, swap);
  presetRow.append(presetBox);

  let ratio = p.hpx / p.wpx;                     // locked aspect, frozen at lock time
  lock.addEventListener("click", () => { if (p.lock) ratio = p.hpx / p.wpx; });
  const apply = soft => {
    p.wpx = Math.max(100, Math.min(8000, +wIn.value || p.wpx));
    p.hpx = Math.max(100, Math.min(8000, +hIn.value || p.hpx));
    if (!soft) { wIn.value = p.wpx; hIn.value = p.hpx; ratio = p.hpx / p.wpx; }
    render();                                    // render() persists — saves on every keystroke
  };
  const onEdit = (src, other, factor) => soft => {
    if (p.lock) other.value = Math.round((+src.value || 100) * factor());
    else preset.value = "custom";
    apply(soft);
  };
  const wEdit = onEdit(wIn, hIn, () => ratio), hEdit = onEdit(hIn, wIn, () => 1 / ratio);
  wIn.addEventListener("input", () => wEdit(true));    // live: saves while typing, no clamp-fight
  wIn.addEventListener("change", () => wEdit(false));  // commit: normalize the field
  hIn.addEventListener("input", () => hEdit(true));
  hIn.addEventListener("change", () => hEdit(false));
  preset.addEventListener("input", () => {
    if (preset.value === "custom") return;
    const [a, b] = preset.value.split(":").map(Number);
    hIn.value = Math.round(p.wpx * b / a);   // width is the anchor
    apply();
  });
  swap.addEventListener("click", () => {
    [wIn.value, hIn.value] = [hIn.value, wIn.value];
    preset.value = "custom";
    apply();
  });
  const mIn = Object.assign(document.createElement("input"), {type: "number", min: 0, max: 4000, value: p.margin});
  const marginRow = document.createElement("label");
  marginRow.innerHTML = "<span>margin px</span>";
  marginRow.append(mIn);
  mIn.addEventListener("input", () => { p.margin = Math.max(0, +mIn.value || 0); render(); });
  // responsive preview: the stage becomes the embed's box (regenerate) — resize
  // the window to see how the maze re-lays itself out on a website
  p.responsive = saved.responsive ?? false;
  const respRow = document.createElement("label");
  respRow.title = "fill the stage like the embed does on a website: the maze re-lays itself out for the window, arrows keep their size";
  respRow.innerHTML = "<span>responsive preview</span>";
  const resp = Object.assign(document.createElement("input"), {type: "checkbox", checked: p.responsive});
  resp.addEventListener("input", () => { p.responsive = resp.checked; render(); });
  respRow.append(resp);
  group("artboard").append(sizeRow, presetRow, marginRow, respRow);
}

for (const [key, type, opt] of DEFS) {
  if (type === "group") { group(opt.label); continue; }
  p[key] = key in saved ? saved[key] : opt.value;
  const label = document.createElement("label");
  const name = document.createElement("span");
  name.textContent = opt.label || key;
  if (opt.hint) label.title = opt.hint;
  label.append(name);
  let input;
  if (type === "select") {
    input = document.createElement("select");
    for (const o of opt.options) input.append(new Option(o, o, o === p[key], o === p[key]));
  } else {
    input = document.createElement("input");
    input.type = type;
    if (type === "range") { Object.assign(input, {min: opt.min, max: opt.max, step: opt.step}); input.dataset.def = opt.value; }
    if (type === "checkbox") input.checked = p[key]; else input.value = p[key];
    if (type === "text") input.placeholder = "one | two | three";
  }
  label.append(input);
  let out;
  if (type === "range") { out = document.createElement("output"); out.value = p[key]; label.append(out); }
  input.addEventListener("input", () => {
    p[key] = type === "checkbox" ? input.checked : type === "range" ? +input.value : input.value;
    if (out) out.value = input.value;
    render();
  });
  cur.append(label);
}
group("snapshots").append(snapshotPanel());

// custom typeface for the words — FontFace renders it live, and the data: URL
// is embedded as an @font-face in the SVG so exports keep the face
// opentype.js parses each uploaded face so "outline words" can bake real glyph
// paths — the exported SVG then renders identically with no font installed
const OT = {main: null, accent: null};
async function parseOT(slot, f) {
  OT[slot] = null;
  if (f?.dataURL) try {
    OT[slot] = opentype.parse(await (await fetch(f.dataURL)).arrayBuffer());
  } catch (e) { console.warn("cannot outline " + slot + " face:", e.message); }
  render();
}
const userFont = fontPicker({onChange: f => parseOT("main", f)});
// a second face (say, a light italic) for single words — the toggle per entry
const accentFont = fontPicker({label: "accent face", key: "font:" + SLUG + ":accent", onChange: f => parseOT("accent", f)});
// one size slider per entry; position is auto until the entry is dragged on the stage
const entries = () => ArrowMaze.entries(p);
p.nodes = saved.nodes || {};                          // text → {size: % cell, x, y: fraction of the artboard or null}
const nodeRows = Object.assign(document.createElement("div"), {id: "nodes"});
let rowsKey;
function syncNodeRows() {
  const es = entries(), key = es.join("|");
  if (key === rowsKey) return;
  rowsKey = key;
  for (const k in p.nodes) if (!es.includes(k)) delete p.nodes[k];
  nodeRows.innerHTML = "";
  for (const t of es) {
    const nd = p.nodes[t] ??= {size: 60, x: null, y: null};
    const label = document.createElement("label"), name = document.createElement("span");
    label.style.gridTemplateColumns = "92px 1fr 30px 16px";   // room for the accent toggle
    name.textContent = t;
    name.title = "size % cell — drag the words on the stage to place them, double-click to snap back";
    const input = Object.assign(document.createElement("input"), {type: "range", min: 20, max: 300, step: 5, value: nd.size});
    input.dataset.def = 60;
    const out = document.createElement("output");
    out.value = nd.size;
    input.addEventListener("input", () => { nd.size = +input.value; out.value = input.value; render(); });
    const acc = Object.assign(document.createElement("input"), {type: "checkbox", checked: !!nd.acc,
      title: "set this word in the accent face"});
    acc.style.cssText = "justify-self:end;grid-column:auto";
    acc.addEventListener("input", () => { nd.acc = acc.checked; render(); });
    label.append(name, input, out, acc);
    nodeRows.append(label);
  }
}
group("text").append(nodeRows, userFont.row, accentFont.row);

// ---------- layers: order (bottom first), visibility, opacity, blend ----------
p.layers = (saved.layers || []).filter(l => LAYERS.includes(l.id));
for (const id of LAYERS) if (!p.layers.some(l => l.id === id)) p.layers.push({id, on: true, opacity: 100, blend: "normal"});
const layerBox = Object.assign(document.createElement("div"), {id: "layers"});
function buildLayers() {
  layerBox.innerHTML = "";
  [...p.layers].reverse().forEach(l => {              // top layer listed first, like any layers panel
    const i = p.layers.indexOf(l);
    const row = Object.assign(document.createElement("div"), {className: "layer"});
    const on = Object.assign(document.createElement("input"), {type: "checkbox", checked: l.on, title: "visible"});
    on.addEventListener("input", () => { l.on = on.checked; render(); });
    const name = Object.assign(document.createElement("b"), {textContent: l.id});
    const mv = (d, t) => {
      const b = Object.assign(document.createElement("button"), {textContent: t, title: d > 0 ? "raise" : "lower"});
      b.addEventListener("click", () => {
        const j = i + d;
        if (j < 0 || j >= p.layers.length) return;
        [p.layers[i], p.layers[j]] = [p.layers[j], p.layers[i]];
        buildLayers(); render();
      });
      return b;
    };
    const op = Object.assign(document.createElement("input"), {type: "range", min: 0, max: 100, step: 5, value: l.opacity, title: "opacity %"});
    op.dataset.def = 100;
    const out = document.createElement("output");
    out.value = l.opacity;
    op.addEventListener("input", () => { l.opacity = +op.value; out.value = op.value; render(); });
    const bl = document.createElement("select");
    bl.title = "blend mode";
    for (const b of BLENDS) bl.append(new Option(b, b, b === l.blend, b === l.blend));
    bl.addEventListener("input", () => { l.blend = bl.value; render(); });
    const head = document.createElement("div"), ctl = document.createElement("div");
    head.append(on, name, mv(1, "\u25B2"), mv(-1, "\u25BC"));
    ctl.append(op, out, bl);
    row.append(head, ctl);
    layerBox.append(row);
  });
}
buildLayers();
group("layers").append(layerBox);

// ---------- colour masters ----------
// A master is a named swatch. The built-ins are what everything uses by
// default (ink/paper by panel polarity, arrow fill, the ring pair for contours); any master
// can also be pinned to single elements: press its "pick" button, then click
// arrows, words, panels, dots or the dividers on the stage. Assignments are
// keyed by element: words by their text, arrows/panels/dots by index.
// ponytail: arrow and dot indices shift when the seed or grid changes — those pins then land on other arrows
for (const [k, , def] of FIXED) p[k] = saved[k] ?? def;
p.masters = saved.masters || [];                      // custom: [{id, name, color}]
p.assign = saved.assign || {};                        // element key → master id
let active = null;                                    // master being pinned with the mouse
const masterColor = id => FIXED.some(f => f[0] === id) ? p[id] : p.masters.find(m => m.id === id)?.color;
const colorOf = (key, auto) => masterColor(p.assign[key]) ?? auto;
const masterBox = Object.assign(document.createElement("div"), {id: "masters"});
function buildMasters() {
  masterBox.innerHTML = "";
  const tiles = [...FIXED.map(([id, name]) => ({id, name})), ...p.masters.map(m => ({id: m.id, m}))];
  for (const t of tiles) {
    const row = Object.assign(document.createElement("div"), {className: "tile" + (active === t.id ? " active" : "")});
    const c = Object.assign(document.createElement("input"), {type: "color", value: masterColor(t.id)});
    c.addEventListener("input", () => { if (t.m) t.m.color = c.value; else p[t.id] = c.value; render(); });
    const name = t.m
      ? Object.assign(document.createElement("input"), {type: "text", value: t.m.name, title: "rename"})
      : Object.assign(document.createElement("span"), {className: "name", textContent: t.name});
    if (t.m) name.addEventListener("input", () => { t.m.name = name.value; localStorage.setItem("arrow-maze", JSON.stringify(p)); });
    const n = Object.values(p.assign).filter(id => id === t.id).length;
    const badge = Object.assign(document.createElement("small"), {textContent: n ? `${n} pinned` : "", title: "elements pinned to this colour"});
    const pick = Object.assign(document.createElement("button"), {className: "pick", textContent: "pick",
      title: "then click elements on the stage to pin them to this colour; click a pinned one again to release it — Esc ends"});
    pick.addEventListener("click", () => { active = active === t.id ? null : t.id; stage.style.cursor = active ? "crosshair" : ""; buildMasters(); });
    row.append(c, name, badge, pick);
    if (t.m) {
      const del = Object.assign(document.createElement("button"), {textContent: "\u00d7", title: "remove this colour; its elements go back to the defaults"});
      del.addEventListener("click", () => {
        p.masters = p.masters.filter(m => m !== t.m);
        for (const k in p.assign) if (p.assign[k] === t.id) delete p.assign[k];
        if (active === t.id) { active = null; stage.style.cursor = ""; }
        buildMasters(); render();
      });
      row.append(del);
    }
    masterBox.append(row);
  }
  const add = Object.assign(document.createElement("button"), {textContent: "+ colour"});
  add.addEventListener("click", () => {
    p.masters.push({id: "m" + Date.now().toString(36), name: "colour " + (p.masters.length + 1), color: "#e84f5e"});
    buildMasters(); render();
  });
  const help = Object.assign(document.createElement("p"), {textContent: "pick a colour, then click things on the stage"});
  masterBox.append(add, help);
}
buildMasters();
group("colour").prepend(masterBox);
addEventListener("keydown", e => { if (e.key === "Escape" && active) { active = null; stage.style.cursor = ""; buildMasters(); } });
// ---------- render + export ----------
// The preview is the embed itself: an <arrow-maze> element (p5 + canvas) that
// lays the scene out and animates it. The SVG export is its static twin.
const stage = document.getElementById("stage");
const zoomEl = document.getElementById("zoom");
const maze = document.createElement("arrow-maze");
maze.setAttribute("fit", "contain");
stage.append(maze);
p.zoom = saved.zoom === "fit" || typeof saved.zoom === "number" ? saved.zoom : "fit";
const view = createZoom({
  stage, select: zoomEl, zoom: p.zoom,
  size: () => ({w: p.wpx, h: p.hpx}),
  onChange: z => { p.zoom = z; localStorage.setItem("arrow-maze", JSON.stringify(p)); },
});
const fonts = () => ({main: userFont.font, accent: accentFont.font});
// the artboard scene, for exports; the preview's own scene may be a responsive one
const artboard = () => ArrowMaze.layout(p, p.wpx, p.hpx, {fonts: fonts(), OT});
function render() {
  syncNodeRows();
  localStorage.setItem("arrow-maze", JSON.stringify(p));
  stage.classList.toggle("responsive", p.responsive);
  maze.setAttribute("fit", p.responsive ? "regenerate" : "contain");
  maze.config = {params: p, fonts: fonts()};
  view.apply();
}
// drag words on the stage (same pattern as switchboard); a double-tap snaps one
// back to auto — detected on pointerdown, since pointer capture retargets the
// second pointerup (and so dblclick) to the stage
let drag = null, dragged = false, lastTap = 0;
const toArt = e => maze.toScene(e.clientX, e.clientY);
const hitAt = e => maze.scene && ArrowMaze.hitTest(maze.scene, ...Object.values(toArt(e)));
stage.addEventListener("pointerdown", e => {
  if (active) {                                      // pinning: the click picks an element for the active master
    const hit = hitAt(e);
    if (hit && e.button === 0) {
      const key = hit.word ? "word:" + hit.word.t : hit.key;
      if (p.assign[key] === active) delete p.assign[key]; else p.assign[key] = active;
      buildMasters(); render();
    }
    e.preventDefault();
    return;
  }
  const hit = hitAt(e);
  if (!hit?.word || e.button !== 0) return;
  e.preventDefault();                                // claim the finger: zoom.js won't pan
  const nd = p.nodes[hit.word.t];
  if (e.timeStamp - lastTap < 400) { lastTap = 0; nd.x = nd.y = null; render(); return; }
  lastTap = e.timeStamp;
  const at = toArt(e);
  drag = {n: hit.word.n, nd, dx: hit.word.cx - at.x, dy: hit.word.cy - at.y, at};
  dragged = false;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) {                                       // hover: words are draggable
    if (!active && e.pointerType === "mouse" && !view.panning) stage.style.cursor = hitAt(e)?.word ? "move" : "";
    return;
  }
  const at = toArt(e), S = maze.scene;
  if (!dragged && Math.hypot(at.x - drag.at.x, at.y - drag.at.y) < S.w * 0.005) return;   // dead zone: still a click
  dragged = true;
  maze.dragOffset = {n: drag.n, dx: at.x - drag.at.x, dy: at.y - drag.at.y};
  maze.redraw();
});
stage.addEventListener("pointerup", e => {
  if (!drag) return;
  const at = toArt(e), d = drag, S = maze.scene; drag = null;
  maze.dragOffset = null;
  if (!dragged) return;                              // a click leaves the picture alone so a double-tap can land
  d.nd.x = Math.max(0, Math.min(1, (at.x + d.dx) / S.w));
  d.nd.y = Math.max(0, Math.min(1, (at.y + d.dy) / S.h));
  render();
});
stage.addEventListener("pointercancel", () => { drag = null; maze.dragOffset = null; maze.redraw(); });

// one frame of a scene on a fresh canvas, scaled to w × h
function paint(S, w, h, t) {
  const c = Object.assign(document.createElement("canvas"), {width: w, height: h});
  const ctx = c.getContext("2d", {willReadFrequently: true});
  ctx.setTransform(w / S.w, 0, 0, h / S.h, 0, 0);
  ArrowMaze.drawScene(ctx, S, t);
  return {c, ctx};
}
// GIF: the layout is computed once, every frame only repaints it
async function exportGIF(setLabel) {
  const S = artboard();
  const scale = Math.min(1, p.gifpx / Math.max(S.w, S.h));
  const w = Math.round(S.w * scale), h = Math.round(S.h * scale);
  const dur = S.timing.moving ? S.timing.T : 0;        // one full cycle; draw-in also covers the stagger tail
  const n = dur ? Math.max(1, Math.round(dur * p.fps)) : 1;
  const frames = [];
  for (let i = 0; i < n; i++) {
    if (i % 5 === 0) { setLabel(`… ${i + 1}/${n}`); await new Promise(r => setTimeout(r)); }   // let the label repaint
    frames.push(paint(S, w, h, dur ? i / n * dur : null).ctx.getImageData(0, 0, w, h).data);
  }
  setLabel("… encoding");
  await new Promise(r => setTimeout(r));
  await saveAs(`arrow-maze-${p.seed}.gif`, encodeGIF(frames, {width: w, height: h, delay: Math.max(2, Math.round(100 / p.fps))}));
}
// embed: a ready-to-paste snippet (in a demo page) plus the runtime next to it
const UI_ONLY = ["open", "zoom", "lock", "responsive", "fps", "gifpx", "outline", "efit", "eplay"];   // ecell rides along: the embed reads it
async function exportEmbed() {
  const params = Object.fromEntries(Object.entries(p).filter(([k]) => !UI_ONLY.includes(k)));
  const fs = Object.fromEntries(Object.entries(fonts()).filter(([, f]) => f.dataURL).map(([k, f]) => [k, {...f}]));
  const json = JSON.stringify({params, fonts: fs}).replace(/</g, "\\u003c");   // never closes the <script>
  const attrs = `fit="${p.efit}"` + (p.eplay === "from motion" ? "" : ` playback="${p.eplay}"`);
  const element = `<arrow-maze ${attrs}>\n  <script type="application/json">${json}<\/script>\n</arrow-maze>`;
  // the demo page inlines the runtime, so it opens anywhere (file://, previews,
  // any folder) with nothing next to it; arrow-maze.embed.js is saved as well
  // for sites, where one shared file beats a copy in every page
  const runtime = ArrowMaze.source();
  const page = `<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrow-maze ${p.seed}</title>
<style>
  body { margin: 0; }
  /* the element fills whatever box the page gives it; with no height it keeps
     the artboard's proportions (${p.wpx} × ${p.hpx}) */
  arrow-maze { height: 100vh; }
</style>
<body>
<!--
  On a website, use the saved arrow-maze.embed.js instead of the inline script:
    <script src="arrow-maze.embed.js" defer><\/script>
    <arrow-maze …> (the element below) </arrow-maze>
  The runtime loads p5 from jsDelivr unless the page already has it (or set
  p5-src="…" to self-host tools/p5.min.js).
  Attributes: fit = regenerate | contain | cover | fixed
              playback = loop | once | in-view | static (default: the design's motion)
              cell = grid cell px (regenerate), pause-offscreen = "false" to keep running,
              reduced-motion = "ignore" to animate even under prefers-reduced-motion
-->
${element}
<script>
${runtime.replace(/<\/script/gi, "<\\/script")}<\/script>
</body>
</html>
`;
  await saveAs(`arrow-maze-${p.seed}.html`, new Blob([page], {type: "text/html"}));
  await saveAs("arrow-maze.embed.js", new Blob([runtime], {type: "text/javascript"}));
}
// the export drops the stage-only data-* handles so Illustrator sees clean groups
const cleanSVG = svg => svg.replace(/ data-(?:el|node|cx|cy)="[^"]*"/g, "");
wireExport({
  SVG: () => saveAs(`arrow-maze-${p.seed}.svg`, svgBlob(cleanSVG(artboard().svg))),
  PNG: async () => {
    const {c} = paint(artboard(), p.wpx, p.hpx, null);
    await saveAs(`arrow-maze-${p.seed}.png`, await new Promise(r => c.toBlob(r, "image/png")));
  },
  GIF: exportGIF,
  Embed: exportEmbed,
});
render();

// self-check: deterministic output for fixed params
console.assert(artboard().svg === artboard().svg, "generator must be deterministic");
</script>
</body>
</html>
