<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Switchboard — interconnected UI elements</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; display: flex; background: #e9e7e2; }
  #panel { width: 264px; margin: 16px; padding: 14px 18px; background: #fff; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0,0,0,.15); box-sizing: border-box; flex-shrink: 0;
           align-self: flex-start; max-height: calc(100vh - 32px); overflow-y: auto; }
  #panel label { display: grid; grid-template-columns: 90px 1fr 38px; align-items: center; margin: 10px 0; gap: 6px; }
  #panel label span:first-child { color: #444; }
  #panel input[type=range] { width: 100%; min-width: 0; margin: 0; }
  #panel input[type=color], #panel select, #panel input[type=checkbox] { justify-self: end; grid-column: 2 / 4; }
  #panel input[type=text] { grid-column: 2 / 4; min-width: 0; box-sizing: border-box; font: inherit; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; }
  #stage { flex: 1; display: flex; overflow: auto; padding: 32px; }
  #stage svg { display: block; margin: auto; flex-shrink: 0; box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  #panel input[type=number] { width: 58px; box-sizing: border-box; font: inherit; }
  #viewbox { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px;
             background: #fff; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  #viewbox span { color: #444; }
  #viewbox select { font: inherit; padding: 3px 6px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns a { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; background: #3b82f6; color: #fff; text-decoration: none; cursor: pointer; }
  .btns select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  #panel details { border-top: 1px solid #eee; }
  #panel details > label:last-child { margin-bottom: 12px; }
  #panel summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between;
                   padding: 7px 0; color: #888; font: 600 11px/1 system-ui; letter-spacing: .07em; text-transform: uppercase; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "+"; font-size: 13px; }
  #panel details[open] summary::after { content: "\2212"; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="mobile.css">
<body>
<div id="panel">
  <h1>Switchboard</h1>
  <div id="controls"></div>
  <div class="btns">
    <select id="fmt" title="file type"></select>
    <a id="dl">⬇ export</a>
    <a id="dldir" title="choose export folder">📁 …</a>
  </div>
</div>
<div id="stage"></div>
<div id="viewbox">
  <span>view</span>
  <select id="zoom">
    <option value="fit">scale to fit</option>
    <option>10%</option><option>25%</option><option>50%</option><option>75%</option>
    <option>100%</option><option>150%</option><option>200%</option>
  </select>
</div>
<script src="export.js"></script>
<script src="zoom.js"></script>
<script src="mobile.js"></script>
<script src="sliders.js"></script>
<script src="fontpick.js"></script>
<script>
// ---------- parameters ----------
// A ["", "group", …] row opens a new collapsible section; rows after it land in it.
const DEFS = [
  ["", "group", {label: "grid"}],
  ["seed",    "range", {min: 1, max: 9999, step: 1, value: 42}],
  ["cols",    "range", {min: 2, max: 12, step: 1, value: 5, label: "columns"}],
  ["rows",    "range", {min: 2, max: 16, step: 1, value: 7, label: "rows"}],
  ["gap",     "range", {min: 0, max: 60, step: 2, value: 24, label: "gap %"}],
  ["jitter",  "range", {min: 0, max: 100, step: 5, value: 0, label: "size jitter %"}],
  ["buttons", "checkbox", {value: true, label: "buttons"}],
  ["dials",   "checkbox", {value: true, label: "sliders + knobs"}],
  ["lights",  "checkbox", {value: true, label: "lights + meters"}],
  ["form",    "checkbox", {value: true, label: "form widgets"}],
  ["labels",  "text",  {value: "ON,OFF,SEND,OK,RUN,A,B,MUTE,ARM,SYNC", label: "labels"}],
  ["", "group", {label: "look"}],
  ["stroke",  "range", {min: 1, max: 24, step: 1, value: 6, label: "stroke px"}],
  ["radius",  "range", {min: 0, max: 60, step: 2, value: 8, label: "corner px"}],
  ["shadow",  "range", {min: 0, max: 40, step: 1, value: 10, label: "shadow px"}],
  ["paper",   "color", {value: "#f4f1ea", label: "paper"}],
  ["ink",     "color", {value: "#111111", label: "ink"}],
  ["on",      "color", {value: "#ffd400", label: "on"}],
  ["accent",  "color", {value: "#ff4d2e", label: "link tint"}],
  ["", "group", {label: "links"}],
  ["links",   "range", {min: 0, max: 60, step: 1, value: 12, label: "links"}],
  ["effect",  "select", {options: ["colour", "size", "colour + size"], value: "colour + size", label: "link effect"}],
  ["strength","range", {min: 0, max: 100, step: 5, value: 70, label: "strength %"}],
  ["propagate","select", {options: ["none", "copy", "invert"], value: "copy", label: "propagate state"}],
  ["wires",   "checkbox", {value: true, label: "draw wires"}],
  ["wire",    "select", {options: ["straight", "elbow", "curve"], value: "curve", label: "wire style"}],
  ["wirepx",  "range", {min: 1, max: 20, step: 1, value: 4, label: "wire px"}],
  ["", "group", {label: "motion"}],
  ["motion",  "select", {options: ["none", "flow"], value: "flow"}],
  ["secs",    "range", {min: 1, max: 20, step: 1, value: 4, label: "cycle secs"}],
  ["", "group", {label: "export"}],
  ["fps",     "range", {min: 5, max: 30, step: 1, value: 20, label: "gif fps"}],
  ["gifpx",   "range", {min: 200, max: 1000, step: 50, value: 600, label: "gif px"}]
];
const p = {};
const saved = JSON.parse(localStorage.getItem("switchboard") || "{}");
const controls = document.getElementById("controls");

// ---------- collapsible groups ----------
// Native <details>: no toggle state machine, and open/closed rides along in the
// same saved blob as every other parameter.
p.open = saved.open || {};
let cur = controls;
const groups = {};
const group = name => cur = groups[name] ??= (() => {
  const d = document.createElement("details");
  d.open = p.open[name] ?? name === "grid";
  d.innerHTML = `<summary>${name}</summary>`;
  d.addEventListener("toggle", () => {
    p.open[name] = d.open;
    localStorage.setItem("switchboard", JSON.stringify(p));
  });
  controls.append(d);
  return d;
})();

// ---------- artboard size (exact pixels) ----------
p.wpx = +saved.wpx || 1500;
p.hpx = +saved.hpx || 2000;
{
  const wIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.wpx});
  const hIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.hpx});
  const preset = document.createElement("select");
  for (const o of ["custom", "2:3", "3:4", "4:5", "1:1", "9:16"]) preset.append(new Option(o, o));
  const swap = Object.assign(document.createElement("button"), {textContent: "⇄", title: "swap width/height"});
  swap.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  p.lock = saved.lock ?? false;
  const lock = Object.assign(document.createElement("button"), {title: "lock aspect ratio"});
  lock.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  const drawLock = () => { lock.textContent = p.lock ? "🔒" : "🔓"; lock.style.background = p.lock ? "#eef" : "#fff"; };
  drawLock();
  lock.addEventListener("click", () => { p.lock = !p.lock; drawLock(); localStorage.setItem("switchboard", JSON.stringify(p)); });

  const sizeRow = document.createElement("label");
  sizeRow.style.cssText = "display:flex;justify-content:space-between;align-items:center";
  sizeRow.innerHTML = "<span>artboard px</span>";
  const sizeBox = document.createElement("span");
  sizeBox.style.cssText = "display:flex;align-items:center;gap:4px";
  sizeBox.append(wIn, "×", hIn, lock);
  sizeRow.append(sizeBox);

  const presetRow = document.createElement("label");
  presetRow.innerHTML = "<span>aspect</span>";
  const presetBox = document.createElement("span");
  presetBox.style.cssText = "display:flex;align-items:center;gap:6px;grid-column:2/4;justify-self:end";
  presetBox.append(preset, swap);
  presetRow.append(presetBox);

  let ratio = p.hpx / p.wpx;                     // locked aspect, frozen at lock time
  lock.addEventListener("click", () => { if (p.lock) ratio = p.hpx / p.wpx; });
  const apply = soft => {
    p.wpx = Math.max(100, Math.min(8000, +wIn.value || p.wpx));
    p.hpx = Math.max(100, Math.min(8000, +hIn.value || p.hpx));
    if (!soft) { wIn.value = p.wpx; hIn.value = p.hpx; ratio = p.hpx / p.wpx; }
    render();                                    // render() persists — saves on every keystroke
  };
  const onEdit = (src, other, factor) => soft => {
    if (p.lock) other.value = Math.round((+src.value || 100) * factor());
    else preset.value = "custom";
    apply(soft);
  };
  const wEdit = onEdit(wIn, hIn, () => ratio), hEdit = onEdit(hIn, wIn, () => 1 / ratio);
  wIn.addEventListener("input", () => wEdit(true));    // live: saves while typing, no clamp-fight
  wIn.addEventListener("change", () => wEdit(false));  // commit: normalize the field
  hIn.addEventListener("input", () => hEdit(true));
  hIn.addEventListener("change", () => hEdit(false));
  preset.addEventListener("input", () => {
    if (preset.value === "custom") return;
    const [a, b] = preset.value.split(":").map(Number);
    hIn.value = Math.round(p.wpx * b / a);   // width is the anchor
    apply();
  });
  swap.addEventListener("click", () => {
    [wIn.value, hIn.value] = [hIn.value, wIn.value];
    preset.value = "custom";
    apply();
  });
  group("artboard").append(sizeRow, presetRow);
}

for (const [key, type, opt] of DEFS) {
  if (type === "group") { group(opt.label); continue; }
  p[key] = key in saved ? saved[key] : opt.value;
  const label = document.createElement("label");
  const name = document.createElement("span");
  name.textContent = opt.label || key;
  label.append(name);
  let input;
  if (type === "select") {
    input = document.createElement("select");
    for (const o of opt.options) input.append(new Option(o, o, o === p[key], o === p[key]));
  } else {
    input = document.createElement("input");
    input.type = type;
    if (type === "range") { Object.assign(input, {min: opt.min, max: opt.max, step: opt.step}); input.dataset.def = opt.value; }
    if (type === "checkbox") input.checked = p[key]; else input.value = p[key];
  }
  label.append(input);
  let out;
  if (type === "range") { out = document.createElement("output"); out.value = p[key]; label.append(out); }
  input.addEventListener("input", () => {
    p[key] = type === "range" ? +input.value : type === "checkbox" ? input.checked : input.value;
    if (out) out.value = input.value;
    render();
  });
  cur.append(label);
}


// custom typeface for widget labels — FontFace renders it live, and the data:
// URL is embedded as an @font-face in the SVG so exports keep the face
const userFont = fontPicker({onChange: () => render()});
group("grid").append(userFont.row);

// per-widget state 0..1, persisted in the same blob; resized to the grid on every render
p.st = Array.isArray(saved.st) ? saved.st : [];
p.order = Array.isArray(saved.order) ? saved.order : [];
{
  const row = document.createElement("label");
  row.style.cssText = "display:flex;gap:6px";
  const btn = (text, fn) => {
    const b = Object.assign(document.createElement("button"), {textContent: text});
    b.style.cssText = "flex:1;font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;padding:4px";
    b.addEventListener("click", fn);
    return b;
  };
  row.append(
    btn("randomise states", () => { const r = mulberry32(p.seed * 7 + 1); p.st = p.st.map(() => Math.round(r() * 4) / 4); render(); }),
    btn("all off", () => { p.st = p.st.map(() => 0); render(); }));
  group("links").append(row);
}

// ---------- generator ----------
function mulberry32(s) {
  return () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const FAMILY = {
  buttons: ["button", "toggle", "checkbox", "radio", "segmented", "stepper"],
  dials:   ["slider", "range", "knob", "gauge"],
  lights:  ["led", "meter", "vu", "counter", "progress"],
  form:    ["chip", "badge", "field", "dropdown"],
};
const measureCtx = document.createElement("canvas").getContext("2d");
// binary kinds flip on click; the rest step through 0 … 1 in quarters
const BINARY = new Set(["button", "toggle", "checkbox", "led", "chip", "field", "dropdown"]);

const f = n => +n.toFixed(2);
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => "#" + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, "0")).join("");
// largest w×h of aspect a that fits the box
const fit = (bw, bh, a) => { let w = bw, h = w / a; if (h > bh) { h = bh; w = h * a; } return [w, h]; };

// time === null → live SMIL animation. A number bakes that instant statically
// (GIF frames), so both paths share one generator.
function makeSVG(time = null) {
  const W = p.wpx, H = p.hpx, n = p.cols * p.rows;
  const rnd = mulberry32(p.seed);
  const sw = p.stroke, dx = p.shadow, dy = p.shadow;
  const strength = p.strength / 100;
  const tint = p.effect !== "size", grow = p.effect !== "colour";
  const kinds = Object.keys(FAMILY).filter(k => p[k]).flatMap(k => FAMILY[k]);
  const allKinds = kinds.length ? kinds : Object.values(FAMILY).flat();
  const labels = p.labels.split(",").map(s => s.trim()).filter(Boolean);
  if (!labels.length) labels.push("ON");
  const fam = userFont.font.family
    ? `${userFont.font.family}, Helvetica, sans-serif`
    : "Helvetica Neue, Helvetica, Arial, sans-serif";
  const fontDefs = userFont.font.dataURL
    ? `<defs><style>@font-face{font-family:"${userFont.font.family}";src:url(${userFont.font.dataURL});}</style></defs>`
    : "";

  // cells: fixed random draws per widget so the stream stays aligned whatever options are set
  const cw = W / p.cols, ch = H / p.rows;
  const cells = [];
  for (let i = 0; i < n; i++) {
    const rKind = rnd(), rLabel = rnd(), rJit = rnd(), rL2 = rnd(), rL3 = rnd();
    cells.push({
      kind: allKinds[Math.floor(rKind * allKinds.length)],
      label: labels[Math.floor(rLabel * labels.length)],
      labels: [rLabel, rL2, rL3].map(r => labels[Math.floor(r * labels.length)]),
      size: 1 - rJit * p.jitter / 100 * 0.6,
      st: p.st[i] ?? 0,
    });
  }
  // grid slot → widget: rearranged by drag and drop, persisted in p.order
  const order = p.order.length === n ? p.order : cells.map((_, i) => i);
  order.forEach((i, slot) => { cells[i].cx = (slot % p.cols + 0.5) * cw; cells[i].cy = (Math.floor(slot / p.cols) + 0.5) * ch; });
  // links: own stream, so link count never reshuffles the widgets
  const rl = mulberry32(p.seed ^ 0x9e37);
  const links = [], seen = new Set();
  for (let k = 0; k < p.links; k++) {
    const a = Math.floor(rl() * n), b = Math.floor(rl() * n);
    if (a === b || seen.has(a * n + b)) continue;
    seen.add(a * n + b); links.push([a, b]);
  }
  // incoming influence per widget = mean state of its sources
  const mod = cells.map(() => ({sum: 0, k: 0}));
  for (const [a, b] of links) { mod[b].sum += cells[a].st; mod[b].k++; }
  cells.forEach((c, i) => c.mod = mod[i].k ? mod[i].sum / mod[i].k * strength : 0);

  // ---- wires (under the widgets) ----
  const wires = [];
  if (p.wires) {
    const dash = p.wirepx * 3, period = dash * 2, loops = 4;
    const offset = time === null ? 0 : -(time / p.secs) * period * loops;
    const anim = p.motion === "flow" && time === null
      ? `<animate attributeName="stroke-dashoffset" from="0" to="${f(-period * loops)}" dur="${p.secs}s" repeatCount="indefinite"/>` : "";
    for (const [a, b] of links) {
      const A = cells[a], B = cells[b], on = A.st > 0.5;
      let d;
      if (p.wire === "straight") d = `M${f(A.cx)} ${f(A.cy)}L${f(B.cx)} ${f(B.cy)}`;
      else if (p.wire === "elbow") d = `M${f(A.cx)} ${f(A.cy)}H${f(B.cx)}V${f(B.cy)}`;
      else {
        const mx = (A.cx + B.cx) / 2, my = (A.cy + B.cy) / 2, vx = B.cx - A.cx, vy = B.cy - A.cy;
        d = `M${f(A.cx)} ${f(A.cy)}Q${f(mx - vy * 0.3)} ${f(my + vx * 0.3)} ${f(B.cx)} ${f(B.cy)}`;
      }
      wires.push(`<path d="${d}" fill="none" stroke="${on ? p.on : p.ink}" stroke-width="${p.wirepx}" stroke-linecap="round"`
        + (on ? ` stroke-dasharray="${f(dash)} ${f(dash)}" stroke-dashoffset="${f(offset)}">${anim}</path>` : "/>"));
    }
  }

  // ---- widget renderers: local coords, origin at the widget centre ----
  const measure = (str, size) => { measureCtx.font = `700 ${f(size)}px ${fam}`; return measureCtx.measureText(str).width; };
  const rect = (x, y, w, h, fill, rx = p.radius) =>
    `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${f(rx)}" fill="${fill}"/>`;
  const srect = (x, y, w, h, fill, rx = p.radius) => rect(x + dx, y + dy, w, h, p.ink, rx) + rect(x, y, w, h, fill, rx);
  const box = (w, h, fill, rx = p.radius) => srect(-w / 2, -h / 2, w, h, fill, rx);
  const circ = (cx, cy, r, fill) => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}"/>`;
  const disc = (r, fill) => circ(dx, dy, r, p.ink) + circ(0, 0, r, fill);
  const line = (x1, y1, x2, y2, w = sw) => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke-width="${f(w)}"/>`;
  const text = (x, y, s, size, fill, anchor = "middle") =>
    `<text x="${f(x)}" y="${f(y)}" font-family="${fam}" font-weight="700" font-size="${f(size)}" fill="${fill}" `
    + `stroke="none" text-anchor="${anchor}" dominant-baseline="central">${esc(s)}</text>`;
  // text widgets: the label sets the width — measured advance plus padding, capped at the
  // cell (type shrinks to fit when the label is too long); height caps so they stay wide
  const tbox = (bw, bh, label, extra = 0, frac = 0.42) => {
    const h = Math.min(bh, bw * 0.6 / (0.7 + extra)), pad = h * (0.7 + extra);   // padding never eats the whole cell
    let size = h * frac, m = measure(label, size);
    if (m + pad > bw) { size = Math.max(h * 0.18, size * (bw - pad) / m); m = measure(label, size); }
    return {w: Math.max(m + pad, h), h, size};              // may exceed the cell: box grows, text never spills
  };
  const chevron = (cx, cy, ch, up) =>
    `<polyline points="${f(cx - ch)},${f(up ? cy + ch / 2 : cy - ch / 2)} ${f(cx)},${f(up ? cy - ch / 2 : cy + ch / 2)} ${f(cx + ch)},${f(up ? cy + ch / 2 : cy - ch / 2)}" fill="none" stroke-width="${f(sw * 1.4)}"/>`;
  const nn = st => String(Math.round(st * 99)).padStart(2, "0");
  const idx3 = st => Math.min(2, Math.floor(st * 3));         // quarter steps → 3 positions
  const draw = {
    button(bw, bh, c, fill) {
      const {w, h, size} = tbox(bw, bh, c.label), on = c.st > 0.5;
      // pressed = sunk into its own shadow
      return (on ? `<g transform="translate(${f(dx)} ${f(dy)})">${rect(-w / 2, -h / 2, w, h, fill)}</g>` : box(w, h, fill))
        + text(on ? dx : 0, on ? dy : 0, c.label, size, p.ink);
    },
    toggle(bw, bh, c, fill) {
      const [w, h] = fit(bw, bh, 2), on = c.st > 0.5, r = h / 2;
      return box(w, h, fill, r) + circ(on ? w / 2 - r : r - w / 2, 0, r - sw, on ? p.ink : p.paper);
    },
    checkbox(bw, bh, c, fill) {
      const [w, h] = fit(bw, bh, 1);
      return box(w, h, fill) + (c.st > 0.5
        ? `<polyline points="${f(-w * 0.3)},${f(0)} ${f(-w * 0.08)},${f(h * 0.25)} ${f(w * 0.32)},${f(-h * 0.28)}" fill="none" stroke-width="${f(sw * 1.8)}"/>` : "");
    },
    radio(bw, bh, c, fill) {
      const d = Math.min(bh * 0.7, bw / 3.6), sel = idx3(c.st);
      let s = "";
      for (let j = 0; j < 3; j++) {
        const x = (j - 1) * d * 1.2;
        s += circ(x + dx, dy, d / 2, p.ink) + circ(x, 0, d / 2, j === sel ? p.on : fill) + (j === sel ? circ(x, 0, d / 5, p.ink) : "");
      }
      return s;
    },
    segmented(bw, bh, c, fill) {
      const h = Math.min(bh, bw * 0.5), sel = idx3(c.st);
      let size = h * 0.36, ws = c.labels.map(l => measure(l, size) + h * 0.5);
      let w = ws.reduce((a, b) => a + b, 0);
      if (w > bw) { const k = bw / w; size *= k; ws = ws.map(x => x * k); w = bw; }
      let s = box(w, h, fill), x = -w / 2;
      ws.forEach((sw2, j) => {
        if (j === sel) s += rect(x, -h / 2, sw2, h, p.on, j === 0 || j === 2 ? p.radius : 0);
        if (j) s += line(x, -h / 2, x, h / 2);
        s += text(x + sw2 / 2, 0, c.labels[j], size, p.ink);
        x += sw2;
      });
      return s;
    },
    stepper(bw, bh, c, fill) {
      const {h, size} = tbox(bw, bh, "00"), w = Math.min(bw, h * 3.4), t = w / 3.4;
      return box(w, h, fill) + line(-w / 2 + t, -h / 2, -w / 2 + t, h / 2) + line(w / 2 - t, -h / 2, w / 2 - t, h / 2)
        + text(-w / 2 + t / 2, 0, "−", size, p.ink) + text(0, 0, nn(c.st), size, p.ink) + text(w / 2 - t / 2, 0, "+", size, p.ink);
    },
    slider(bw, bh, c, fill) {
      const [w, h] = fit(bw, bh, 4), th = h * 0.36, x = -w / 2 + h / 2 + c.st * (w - h);
      return rect(-w / 2, -th / 2, w, th, fill, th / 2) + (c.st ? rect(-w / 2, -th / 2, x + w / 2, th, p.on, th / 2) : "") + box(h * 0.6, h, p.paper);
    },
    range(bw, bh, c, fill) {
      const [w, h] = fit(bw, bh, 4), th = h * 0.36, span = 0.35;
      const lo = -w / 2 + h / 2 + c.st * (1 - span) * (w - h), hi = lo + span * (w - h);
      return rect(-w / 2, -th / 2, w, th, fill, th / 2) + rect(lo, -th / 2, hi - lo, th, p.on, th / 2)
        + srect(lo - h * 0.3, -h / 2, h * 0.6, h, p.paper) + srect(hi - h * 0.3, -h / 2, h * 0.6, h, p.paper);
    },
    knob(bw, bh, c, fill) {
      const r = Math.min(bw, bh) / 2, a = (-225 + 270 * c.st) * Math.PI / 180;
      return disc(r, fill) + line(0, 0, Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, sw * 1.6)
        + circ(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, sw * 1.2, c.st > 0 ? p.on : p.ink);
    },
    gauge(bw, bh, c, fill) {
      const r = Math.min(bw / 2, bh / 1.4), cy = r / 2.5, a = Math.PI * (1 + c.st);   // half dial, needle sweeps left → right
      const arc = (r, to, stroke, width) => `<path d="M${f(-r)} ${f(cy)}A${f(r)} ${f(r)} 0 0 1 ${f(Math.cos(to) * r)} ${f(cy + Math.sin(to) * r)}" fill="none" stroke="${stroke}" stroke-width="${f(width)}"/>`;
      return `<path d="M${f(-r + dx)} ${f(cy + dy)}A${f(r)} ${f(r)} 0 0 1 ${f(r + dx)} ${f(cy + dy)}Z" fill="${p.ink}"/>`
        + `<path d="M${f(-r)} ${f(cy)}A${f(r)} ${f(r)} 0 0 1 ${f(r)} ${f(cy)}Z" fill="${fill}"/>`
        + (c.st ? arc(r - sw * 2, a, p.on, sw * 2) : "")
        + line(0, cy, Math.cos(a) * r * 0.75, cy + Math.sin(a) * r * 0.75, sw * 1.6) + circ(0, cy, sw * 1.5, p.ink);
    },
    led(bw, bh, c, fill) {
      return disc(Math.min(bw, bh) * 0.35, c.st > 0.5 ? p.on : fill);
    },
    meter(bw, bh, c, fill) {
      const [w, h] = fit(bw, bh, 1.6), k = 6, pad = h * 0.12, bh2 = (h - pad * 2), bw2 = (w - pad * 2) / k;
      let s = box(w, h, fill);
      for (let j = 0; j < k; j++)
        s += rect(-w / 2 + pad + j * bw2 + pad * 0.25, -h / 2 + pad, bw2 - pad * 0.5, bh2, (j + 0.5) / k <= c.st ? p.on : p.paper, 0);
      return s;
    },
    vu(bw, bh, c, fill) {
      const [w, h] = fit(bw, bh, 1.3), k = 5, bw2 = w / k;
      let s = "";
      for (let j = 0; j < k; j++) {
        const hj = h * (0.3 + 0.7 * j / (k - 1));
        s += srect(-w / 2 + j * bw2 + bw2 * 0.1, h / 2 - hj, bw2 * 0.8, hj, (j + 0.5) / k <= c.st ? p.on : fill, 0);
      }
      return s;
    },
    counter(bw, bh, c, fill) {
      const {w, h, size} = tbox(bw, bh, "00", 0, 0.6);
      return box(w, h, fill) + text(0, 0, nn(c.st), size, p.ink);
    },
    progress(bw, bh, c, fill) {
      const h = Math.min(bh, bw * 0.3), w = bw, size = h * 0.5;
      return box(w, h, fill) + (c.st ? rect(-w / 2, -h / 2, w * c.st, h, p.on) : "") + text(0, 0, nn(c.st) + "%", size, p.ink);
    },
    chip(bw, bh, c, fill) {
      const {w, h, size} = tbox(bw, bh, c.label);
      return box(w, h, fill, h / 2) + text(0, 0, c.label, size, p.ink);
    },
    badge(bw, bh, c, fill) {
      const {w, h, size} = tbox(bw, bh, c.label, 0.9), r = h * 0.32;
      return box(w, h, fill, h / 2) + text(-w / 2 + h * 0.35, 0, c.label, size, p.ink, "start")
        + circ(w / 2 - h * 0.45 + dx * 0.5, dy * 0.5, r, p.ink) + circ(w / 2 - h * 0.45, 0, r, p.on) + text(w / 2 - h * 0.45, 0, String(Math.round(c.st * 9)), r * 1.2, p.ink);
    },
    field(bw, bh, c, fill) {
      const {w, h, size} = tbox(bw, bh, c.label, 0.5), on = c.st > 0.5, pad = h * 0.3;
      return box(w, h, fill) + text(-w / 2 + pad, 0, c.label, size, p.ink, "start")
        + (on ? rect(-w / 2 + pad + measure(c.label, size) + sw, -h * 0.3, sw * 1.2, h * 0.6, p.accent, 0) : "");
    },
    dropdown(bw, bh, c, fill) {
      const {w, h, size} = tbox(bw, bh, c.label, 0.9), on = c.st > 0.5, pad = h * 0.3;
      return box(w, h, fill) + text(-w / 2 + pad, 0, c.label, size, p.ink, "start") + chevron(w / 2 - pad, 0, h * 0.18, on);
    },
  };

  const widgets = cells.map((c, i) => {
    const bw = cw * (1 - p.gap / 100) * c.size, bh = ch * (1 - p.gap / 100) * c.size;
    const base = BINARY.has(c.kind) && c.st > 0.5 ? p.on : p.paper;
    const fill = tint ? mix(base, p.accent, c.mod) : base;
    const s = grow ? 1 + 0.4 * c.mod : 1;
    return `<g data-i="${i}" transform="translate(${f(c.cx)} ${f(c.cy)}) scale(${f(s)})">${draw[c.kind](bw, bh, c, fill)}</g>`;
  });

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`
    + fontDefs + `<rect width="${W}" height="${H}" fill="${p.paper}"/>`
    + wires.join("")
    + `<g stroke="${p.ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">${widgets.join("")}</g>`
    + `</svg>`;
  return {w: W, h: H, svg, kinds: cells.map(c => c.kind), links};
}

// ---------- render + export ----------
const stage = document.getElementById("stage");
const zoomEl = document.getElementById("zoom");
p.zoom = saved.zoom === "fit" || typeof saved.zoom === "number" ? saved.zoom : "fit";
let art;
const view = createZoom({
  stage, select: zoomEl, zoom: p.zoom,
  size: () => ({w: art.w, h: art.h}),
  onChange: z => { p.zoom = z; localStorage.setItem("switchboard", JSON.stringify(p)); },
});
function render() {
  const n = p.cols * p.rows;
  p.st = Array.from({length: n}, (_, i) => p.st[i] ?? 0);
  p.order = p.order.filter(i => i < n);
  for (let i = 0; i < n; i++) if (!p.order.includes(i)) p.order.push(i);
  localStorage.setItem("switchboard", JSON.stringify(p));
  art = makeSVG();
  stage.innerHTML = art.svg;
  for (const g of stage.querySelectorAll("g[data-i]")) g.style.cursor = "grab";
  view.apply();
}

// drag a widget onto another cell to swap the two; a press without movement is a click
let drag = null, dragged = false;
const toArt = e => {
  const r = stage.querySelector("svg").getBoundingClientRect();
  return {x: (e.clientX - r.left) / r.width * art.w, y: (e.clientY - r.top) / r.height * art.h};
};
stage.addEventListener("pointerdown", e => {
  const g = e.target.closest("g[data-i]");
  if (!g || view.panning || e.button !== 0) return;
  const at = toArt(e);
  drag = {g, i: +g.dataset.i, x0: at.x, y0: at.y, base: g.getAttribute("transform")};
  dragged = false;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const at = toArt(e), mx = at.x - drag.x0, my = at.y - drag.y0;
  if (!dragged && Math.hypot(mx, my) < art.w * 0.005) return;   // dead zone: still a click
  if (!dragged) { dragged = true; drag.g.parentNode.append(drag.g); }  // raise above siblings
  drag.g.setAttribute("transform", `translate(${mx.toFixed(1)} ${my.toFixed(1)}) ${drag.base}`);
});
stage.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!dragged) return;                              // the click handler takes it from here
  const at = toArt(e);
  const col = Math.max(0, Math.min(p.cols - 1, Math.floor(at.x / (art.w / p.cols))));
  const row = Math.max(0, Math.min(p.rows - 1, Math.floor(at.y / (art.h / p.rows))));
  const to = row * p.cols + col, from = p.order.indexOf(d.i);
  [p.order[to], p.order[from]] = [p.order[from], p.order[to]];   // snap: swap slots
  render();
});
stage.addEventListener("pointercancel", () => { drag = null; dragged = false; });

// click a widget: flip / step its state, then push it along outgoing wires
stage.addEventListener("click", e => {
  const g = e.target.closest("g[data-i]");
  if (!g || view.panning || dragged) return;
  const i = +g.dataset.i;
  p.st[i] = BINARY.has(art.kinds[i]) ? (p.st[i] > 0.5 ? 0 : 1) : (p.st[i] + 0.25) % 1.25;
  if (p.propagate !== "none") {
    const seen = new Set([i]);                     // visited set: cycles terminate
    const walk = a => {
      for (const [s, d] of art.links) if (s === a && !seen.has(d)) {
        seen.add(d);
        p.st[d] = p.propagate === "copy" ? p.st[a] : 1 - p.st[a];
        walk(d);
      }
    };
    walk(i);
  }
  render();
});

async function exportGIF(setLabel) {
  const scale = Math.min(1, p.gifpx / Math.max(art.w, art.h));
  const w = Math.round(art.w * scale), h = Math.round(art.h * scale);
  // one full loop of the wire flow; static art is a single frame
  const n = p.motion === "none" ? 1 : Math.max(1, Math.round(p.secs * p.fps));
  const frames = [];
  try {
    for (let i = 0; i < n; i++) {
      setLabel(`… ${i + 1}/${n}`);
      await new Promise(r => setTimeout(r));           // let the label repaint
      frames.push(await rasterise(makeSVG(i / n * p.secs).svg, w, h));
    }
    setLabel("… encoding");
    await new Promise(r => setTimeout(r));
    const blob = encodeGIF(frames, {width: w, height: h, delay: Math.max(2, Math.round(100 / p.fps))});
    await saveAs(`switchboard-${p.seed}.gif`, blob);
  } finally {
    render();                                          // restore the live SVG
  }
}

wireExport({
  SVG: () => saveAs(`switchboard-${p.seed}.svg`, svgBlob(art.svg)),
  PNG: async () => saveAs(`switchboard-${p.seed}.png`, await svgToPNG(art.svg, art.w, art.h)),
  GIF: exportGIF,
});

render();

// self-check: deterministic output for fixed params
console.assert(makeSVG().svg === makeSVG().svg, "generator must be deterministic");
</script>
</body>
</html>
