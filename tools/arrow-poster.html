<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Arrow Poster — parametric generator</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; display: flex; background: #e9e7e2; }
  #panel { width: 264px; margin: 16px; padding: 14px 18px; background: #fff; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0,0,0,.15); box-sizing: border-box; flex-shrink: 0;
           align-self: flex-start; max-height: calc(100vh - 32px); overflow-y: auto; }
  #panel label { display: grid; grid-template-columns: 90px 1fr 38px; align-items: center; margin: 10px 0; gap: 6px; }
  #panel label span:first-child { color: #444; }
  #panel input[type=range] { width: 100%; min-width: 0; margin: 0; }
  #panel input[type=color], #panel select, #panel input[type=checkbox] { justify-self: end; grid-column: 2 / 4; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; }
  #stage { flex: 1; display: flex; overflow: auto; padding: 32px; }
  #stage svg { display: block; margin: auto; flex-shrink: 0; box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  #panel input[type=number] { width: 58px; box-sizing: border-box; font: inherit; }
  #viewbox { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px;
             background: #fff; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  #viewbox span { color: #444; }
  #viewbox select { font: inherit; padding: 3px 6px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns a { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; background: #3b82f6; color: #fff; text-decoration: none; cursor: pointer; }
  .btns select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  #panel details { border-top: 1px solid #eee; }
  #panel details > label:last-child { margin-bottom: 12px; }
  #panel summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between;
                   padding: 7px 0; color: #888; font: 600 11px/1 system-ui; letter-spacing: .07em; text-transform: uppercase; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "+"; font-size: 13px; }
  #panel details[open] summary::after { content: "\2212"; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="mobile.css">
<body>
<div id="panel">
  <h1>Arrow Poster</h1>
  <div id="controls"></div>
  <div class="btns">
    <select id="fmt" title="file type"></select>
    <a id="dl">⬇ export</a>
    <a id="dldir" title="choose export folder">📁 …</a>
  </div>
</div>
<div id="stage"></div>
<div id="viewbox">
  <span>view</span>
  <select id="zoom">
    <option value="fit">scale to fit</option>
    <option>10%</option><option>25%</option><option>50%</option><option>75%</option>
    <option>100%</option><option>150%</option><option>200%</option>
  </select>
</div>
<script src="export.js"></script>
<script src="zoom.js"></script>
<script src="mobile.js"></script>
<script src="sliders.js"></script>
<script src="snapshots.js"></script>
<script>
// ---------- parameters ----------
// A ["", "group", …] row opens a new collapsible section; rows after it land in it.
const DEFS = [
  ["", "group", {label: "arrows"}],
  ["seed",   "range", {min: 1, max: 9999, step: 1, value: 42}],
  ["count",  "range", {min: 1, max: 15, step: 1, value: 6, label: "arrows"}],
  ["size",   "range", {min: 40, max: 200, step: 5, value: 100, label: "scale %"}],
  ["cols",   "range", {min: 1, max: 5, step: 1, value: 2, label: "grid cols"}],
  ["rows",   "range", {min: 1, max: 6, step: 1, value: 3, label: "grid rows"}],
  ["jitter", "range", {min: 0, max: 100, step: 5, value: 20, label: "jitter %"}],
  ["snap",   "select", {options: ["free", "45°", "90°"], value: "45°", label: "rotation"}],
  ["", "group", {label: "geometry"}],
  ["headL",  "range", {min: 15, max: 85, step: 1, value: 40, label: "head length %"}],
  ["headW",  "range", {min: 20, max: 130, step: 1, value: 95, label: "head width %"}],
  ["shaftW", "range", {min: 8, max: 90, step: 1, value: 42, label: "shaft width %"}],
  ["shaftL", "range", {min: 10, max: 500, step: 5, value: 100, label: "shaft length %"}],
  ["variety", "range", {min: 0, max: 100, step: 5, value: 25, label: "variety %"}],
  ["", "group", {label: "colour"}],
  ["color",  "color", {value: "#e84f5e", label: "arrow color"}],
  ["paper",  "color", {value: "#f4f1ea", label: "paper"}],
  ["cwidth", "range", {min: 0, max: 16, step: 0.5, value: 4, label: "contour px"}],
  ["gradA",  "color", {value: "#1c1c1c", label: "gradient start"}],
  ["gradB",  "color", {value: "#f5c518", label: "gradient end"}],
  ["steps",  "range", {min: 1, max: 8, step: 1, value: 4, label: "contour colors"}],
  ["", "group", {label: "motion"}],
  ["motion", "select", {options: ["none", "draw in", "draw loop"], value: "none", label: "motion"}],
  ["speed",  "range", {min: 0.5, max: 20, step: 0.5, value: 3, label: "cycle sec"}],
  ["hold",   "range", {min: 0, max: 90, step: 5, value: 35, label: "hold %"}],
  ["stagger","range", {min: 0, max: 100, step: 5, value: 50, label: "stagger %"}],
  ["timing", "select", {options: ["ease out", "linear", "snap"], value: "ease out", label: "timing"}],
  ["", "group", {label: "export"}],
  ["fps",    "range", {min: 5, max: 30, step: 1, value: 20, label: "gif fps"}],
  ["gifpx",  "range", {min: 200, max: 1000, step: 50, value: 600, label: "gif px"}]
];
const p = {};
const saved = JSON.parse(localStorage.getItem("arrow-poster") || "{}");
p.zorder = saved.zorder || [];
const controls = document.getElementById("controls");

// ---------- collapsible groups ----------
// Native <details>: no toggle state machine, and open/closed rides along in the
// same saved blob as every other parameter.
p.open = saved.open || {};
let cur = controls;
const groups = {};
const group = name => cur = groups[name] ??= (() => {
  const d = document.createElement("details");
  d.open = p.open[name] ?? name === "arrows";
  d.innerHTML = `<summary>${name}</summary>`;
  d.addEventListener("toggle", () => {
    p.open[name] = d.open;
    localStorage.setItem("arrow-poster", JSON.stringify(p));
  });
  controls.append(d);
  return d;
})();

// ---------- artboard size (exact pixels) ----------
p.wpx = +saved.wpx || 1500;
p.hpx = +saved.hpx || 2000;
{
  const wIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.wpx});
  const hIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.hpx});
  const preset = document.createElement("select");
  for (const o of ["custom", "2:3", "3:4", "4:5", "1:1", "9:16"]) preset.append(new Option(o, o));
  const swap = Object.assign(document.createElement("button"), {textContent: "⇄", title: "swap width/height"});
  swap.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  p.lock = saved.lock ?? false;
  const lock = Object.assign(document.createElement("button"), {title: "lock aspect ratio"});
  lock.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  const drawLock = () => { lock.textContent = p.lock ? "🔒" : "🔓"; lock.style.background = p.lock ? "#eef" : "#fff"; };
  drawLock();
  lock.addEventListener("click", () => { p.lock = !p.lock; drawLock(); localStorage.setItem("arrow-poster", JSON.stringify(p)); });

  const sizeRow = document.createElement("label");
  sizeRow.style.cssText = "display:flex;justify-content:space-between;align-items:center";
  sizeRow.innerHTML = "<span>artboard px</span>";
  const sizeBox = document.createElement("span");
  sizeBox.style.cssText = "display:flex;align-items:center;gap:4px";
  sizeBox.append(wIn, "×", hIn, lock);
  sizeRow.append(sizeBox);

  const presetRow = document.createElement("label");
  presetRow.innerHTML = "<span>aspect</span>";
  const presetBox = document.createElement("span");
  presetBox.style.cssText = "display:flex;align-items:center;gap:6px;grid-column:2/4;justify-self:end";
  presetBox.append(preset, swap);
  presetRow.append(presetBox);

  let ratio = p.hpx / p.wpx;                     // locked aspect, frozen at lock time
  lock.addEventListener("click", () => { if (p.lock) ratio = p.hpx / p.wpx; });
  const apply = soft => {
    p.wpx = Math.max(100, Math.min(8000, +wIn.value || p.wpx));
    p.hpx = Math.max(100, Math.min(8000, +hIn.value || p.hpx));
    if (!soft) { wIn.value = p.wpx; hIn.value = p.hpx; ratio = p.hpx / p.wpx; }
    render();                                    // render() persists — saves on every keystroke
  };
  const onEdit = (src, other, factor) => soft => {
    if (p.lock) other.value = Math.round((+src.value || 100) * factor());
    else preset.value = "custom";
    apply(soft);
  };
  const wEdit = onEdit(wIn, hIn, () => ratio), hEdit = onEdit(hIn, wIn, () => 1 / ratio);
  wIn.addEventListener("input", () => wEdit(true));    // live: saves while typing, no clamp-fight
  wIn.addEventListener("change", () => wEdit(false));  // commit: normalize the field
  hIn.addEventListener("input", () => hEdit(true));
  hIn.addEventListener("change", () => hEdit(false));
  preset.addEventListener("input", () => {
    if (preset.value === "custom") return;
    const [a, b] = preset.value.split(":").map(Number);
    hIn.value = Math.round(p.wpx * b / a);   // width is the anchor
    apply();
  });
  swap.addEventListener("click", () => {
    [wIn.value, hIn.value] = [hIn.value, wIn.value];
    preset.value = "custom";
    apply();
  });
  group("artboard").append(sizeRow, presetRow);
}

for (const [key, type, opt] of DEFS) {
  if (type === "group") { group(opt.label); continue; }
  p[key] = key in saved ? saved[key] : opt.value;
  const label = document.createElement("label");
  const name = document.createElement("span");
  name.textContent = opt.label || key;
  label.append(name);
  let input;
  if (type === "select") {
    input = document.createElement("select");
    for (const o of opt.options) input.append(new Option(o, o, o === p[key], o === p[key]));
  } else {
    input = document.createElement("input");
    input.type = type;
    if (type === "range") { Object.assign(input, {min: opt.min, max: opt.max, step: opt.step}); input.dataset.def = opt.value; }
    if (type === "checkbox") input.checked = p[key]; else input.value = p[key];
  }
  label.append(input);
  let out;
  if (type === "range") { out = document.createElement("output"); out.value = p[key]; label.append(out); }
  input.addEventListener("input", () => {
    p[key] = type === "checkbox" ? input.checked : type === "range" ? +input.value : input.value;
    if (out) out.value = input.value;
    render();
  });
  cur.append(label);
}
group("snapshots").append(snapshotPanel());

// shape mix checkboxes
const KINDS = ["block", "round", "roof", "tri", "hook"];
p.kinds = saved.kinds ?? [...KINDS];
{
  const row = document.createElement("label");
  row.innerHTML = "<span>shapes</span>";
  const box = document.createElement("span");
  box.style.cssText = "display:flex;flex-wrap:wrap;gap:4px 8px;flex:1";
  for (const k of KINDS) {
    const l = document.createElement("label");
    l.style.cssText = "display:inline-flex;gap:3px;margin:0";
    const cb = Object.assign(document.createElement("input"), {type: "checkbox", checked: p.kinds.includes(k)});
    cb.addEventListener("input", () => {
      p.kinds = KINDS.filter((_, i) => box.querySelectorAll("input")[i].checked);
      render();
    });
    l.append(cb, k);
    box.append(l);
  }
  row.append(box);
  group("arrows").append(row);
}

// ---------- Lab gradient (matches d3.interpolateLab) ----------
const hex2lab = h => {
  const [r, g, b] = [1, 3, 5].map(i => {
    const c = parseInt(h.slice(i, i + 2), 16) / 255;
    return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
  });
  const xyz = [
    (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047,
    0.2126 * r + 0.7152 * g + 0.0722 * b,
    (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883
  ].map(v => v > 0.008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116);
  return [116 * xyz[1] - 16, 500 * (xyz[0] - xyz[1]), 200 * (xyz[1] - xyz[2])];
};
const lab2rgb = ([L, A, B]) => {
  const y = (L + 16) / 116, x = y + A / 500, z = y - B / 200;
  const [X, Y, Z] = [x, y, z].map(v => v ** 3 > 0.008856 ? v ** 3 : (v - 16 / 116) / 7.787);
  const lin = [
    3.2406 * X * 0.95047 - 1.5372 * Y - 0.4986 * Z * 1.08883,
    -0.9689 * X * 0.95047 + 1.8758 * Y + 0.0415 * Z * 1.08883,
    0.0557 * X * 0.95047 - 0.204 * Y + 1.057 * Z * 1.08883
  ];
  return "rgb(" + lin.map(c => {
    const s = c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055;
    return Math.max(0, Math.min(255, Math.round(255 * s)));
  }).join(",") + ")";
};
const gradient = (a, b) => {
  const la = hex2lab(a), lb = hex2lab(b);
  return t => lab2rgb(la.map((v, i) => v + t * (lb[i] - v)));
};

// ---------- generator (same as the pi-ui widget) ----------
// time === null → live SMIL animation. A number bakes that instant statically
// (GIF frames), so both paths share one generator.
function makeSVG(time = null) {
  const W = p.wpx, H = p.hpx;
  const mulberry = s => () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rnd = mulberry(p.seed), rnd2 = mulberry(p.seed * 31 + 7), rnd3 = mulberry(p.seed * 97 + 13),
        rnd4 = mulberry(p.seed * 131 + 19);
  const f = n => +n.toFixed(2), f3 = n => +n.toFixed(3);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const g = gradient(p.gradA, p.gradB);
  const pal = Array.from({length: p.steps}, (_, i) => g(p.steps === 1 ? 0.5 : i / (p.steps - 1)));
  const kinds = p.kinds.length ? p.kinds : KINDS;

  // motion timing, shared by SMIL and baked frames (same math as arrow-comb)
  const moving = p.motion !== "none", loop = p.motion === "draw loop";
  const m = Math.max(0.05, 1 - p.hold / 100);    // reveal ends at m of the cycle
  const F = {"ease out": x => 1 - (1 - x) ** 3, "linear": x => x, "snap": x => x >= 1 ? 1 : 0};
  const progress = (ph, t) => {
    let c = t / p.speed + (loop ? ph : -ph);
    c = loop ? c - Math.floor(c) : clamp(c, 0, 1);
    return F[p.timing](Math.min(1, c / m));
  };
  // one shared timing for the travelling head and its mask eraser; draw-in folds
  // its stagger into the keyTimes so the head waits at the tail
  const T = loop ? p.speed : p.speed * (1 + p.stagger / 100);
  const SPL = {"ease out": ".16 1 .3 1", "linear": "0 0 1 1"};
  const smil = ph => {
    const kt = loop ? [0, m, 1] : [0, ph * p.speed / T, Math.min(1, (ph + m) * p.speed / T), 1];
    const seg = loop ? [1, 0] : [0, 1, 0];               // which segment is the reveal
    const calc = p.timing === "snap" ? ` calcMode="discrete"`
      : ` calcMode="spline" keySplines="${seg.map(s => s ? SPL[p.timing] : "0 0 1 1").join(";")}"`;
    return ` keyTimes="${kt.map(k => +k.toFixed(4)).join(";")}" dur="${f(T)}s"`
      + ` begin="${loop ? f(-ph * p.speed) : 0}s"`
      + (loop ? ` repeatCount="indefinite"` : ` fill="freeze"`) + calc;
  };
  const pw = W, ph = H;
  const parts = [`<rect width="${W}" height="${H}" fill="${p.paper}"/>`];
  const inner = [];

  const cw = pw / p.cols, ch = ph / p.rows, ncells = p.cols * p.rows;
  const order = Array.from({length: ncells}, (_, i) => i);
  for (let i = ncells - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    [order[i], order[j]] = [order[j], order[i]];
  }

  for (let i = 0; i < p.count; i++) {
    const cell = order[i % ncells];
    const x = (cell % p.cols + 0.5) * cw + (rnd() - 0.5) * cw * (p.jitter / 100);
    const y = ((cell / p.cols | 0) + 0.5) * ch + (rnd() - 0.5) * ch * (p.jitter / 100);
    const sc = f(Math.min(cw, ch) * (0.4 + rnd() * 0.25) * (p.size / 100));
    let a = rnd() * 360;
    if (p.snap !== "free") {
      const st = p.snap === "45°" ? 45 : 90;
      a = Math.round(a / st) * st;
    }
    const pos = `translate(${f(x)} ${f(y)})`;         // arrow origin, in artboard space
    const loc = `rotate(${f(a)}) scale(${sc})`;       // orientation + size, about that origin
    const kind = kinds[(rnd() * kinds.length) | 0];

    // per-arrow geometry: sliders ± variety, drawn unconditionally so the
    // stream stays aligned whatever kinds are selected
    const v = p.variety / 100;
    const vr = () => 1 + (rnd3() * 2 - 1) * v;
    const hw = clamp(p.headW / 100 * vr(), 0.2, 1.4);
    const hl = clamp(p.headL / 100 * vr(), 0.15, 0.85);
    const sw = clamp(p.shaftW / 100 * vr(), 0.08, hw * 0.92);
    const sl = clamp(p.shaftL / 100 * vr(), 0.1, 5);

    // ---- motion, arrow-comb style: the arrow is split into a static shaft and
    // a travelling head. The head lives in a "motion frame" (base centred on the
    // origin, tip along +x) and rides the shaft's centreline (tail → head
    // base, local coords) via animateMotion rotate="auto" live, or a baked
    // pose(r) transform; a mask eraser on the same motion hides the shaft ahead
    // of the head, so it is revealed behind it — declarative, so exports stay animated.
    const b = -1 + 2 * hl;
    let acc = 0;
    const rings = p.cwidth
      ? pal.map(c => { acc += (p.cwidth / sc) * (0.4 + rnd2() * 1.2); return {c, w: acc}; }).reverse()
      : [];
    const w1 = rings.length ? rings[0].w : 0;            // widest contour, local units
    const ext = w1 + 0.05;                               // wipe starts behind the tail: covers the contour's end
    const swv = f(1.3 * sw);                             // hook shaft stroke
    let shaft = null, sh = sw, HL = 1 + b, HW = hw;      // shaft path, shaft half-width, head length/half-width
    let dPath, pose;                                     // centreline tail → head base, and the pose at fraction r
    const straight = y0 => {                             // vertical centreline from y0 (behind the tail) up to b
      y0 = f(y0); const Lh = y0 - f(b);
      dPath = `M0 ${y0}L0 ${f(b)}`;
      pose = r => `translate(0 ${f(y0 - clamp(r, 0, 1) * Lh)}) rotate(-90)`;
    };
    if (kind === "block") {
      const e = b + (1 - b) * sl;
      shaft = `M${f(-sw)} ${f(b)} L${f(sw)} ${f(b)} L${f(sw)} ${f(e)} L${f(-sw)} ${f(e)} Z`;
      straight(e + ext);
    } else if (kind === "round") {
      const t = Math.max(b + 0.05, b + (1 - b) * sl - sw);
      shaft = `M${f(-sw)} ${f(b)} L${f(sw)} ${f(b)} L${f(sw)} ${f(t)} A${f(sw)} ${f(sw)} 0 0 1 ${f(-sw)} ${f(t)} Z`;
      straight(t + sw + ext);
    } else if (kind === "roof") {
      const t = b + 0.4 * sl;
      shaft = `M${f(-sw)} ${f(b)} L${f(sw)} ${f(b)} L${f(sw)} ${f(t)} L${f(-sw)} ${f(t)} Z`;
      HW = 2 * hw;
      straight(t + ext);
    } else if (kind === "tri") {                         // no shaft: travels its own length
      HL = 1.9;
      dPath = "M0 2.7L0 0.8";
      pose = r => `translate(0 ${f(2.7 - clamp(r, 0, 1) * 1.9)}) rotate(-90)`;
    } else {                                             // hook: stroked shaft, quarter arc into the head
      // the exact arc is the motion path — a polyline stand-in makes rotate="auto"
      // snap at every vertex — and the baked pose walks the same line analytically
      const x0 = Math.max(0.2, 0.95 * sl), L0 = f(x0 + ext), La = 0.3 * Math.PI;
      shaft = `M${f(x0)} 0.6 L0 0.6 A0.6 0.6 0 0 1 -0.6 0`;
      dPath = `M${L0} 0.6L0 0.6A0.6 0.6 0 0 1 -0.6 0`;
      pose = r => {
        const s = clamp(r, 0, 1) * (L0 + La);
        if (s <= L0) return `translate(${f(L0 - s)} 0.6) rotate(180)`;
        const th = Math.PI / 2 + (s - L0) / 0.6;         // clockwise from south to west
        return `translate(${f(0.6 * Math.cos(th))} ${f(0.6 * Math.sin(th))}) rotate(${f(th * 180 / Math.PI + 90)})`;
      };
      sh = 0.65 * sw; HL = 0.7 * hw; HW = 0.55 * hw;
    }
    // head in the motion frame; the fill carries a small tab back into the
    // shaft so the two never show a seam where the reveal front meets the base
    const tab = shaft ? Math.min(sh, HW) : 0;
    const headRing = `M0 ${f(HW)} L${f(HL)} 0 L0 ${f(-HW)} Z`;
    const headFill = `M0 ${f(HW)} L${f(HL)} 0 L0 ${f(-HW)}` + (tab ? ` L-0.01 ${f(-tab)} L-0.01 ${f(tab)}` : "") + " Z";

    const beat = Math.round(rnd4() * 8) / 8;             // phases land on a 1/8 grid
    const ph = (p.stagger / 100) * beat;
    const id = `m${i}`;
    let mask = "", mk = "", headAnim = "", headAttr = ` transform="${pose(1)}"`;
    if (moving) {
      if (time === null) {
        headAnim = `<animateMotion path="${dPath}" rotate="auto" keyPoints="${loop ? "0;1;1" : "0;0;1;1"}"${smil(ph)}/>`;
        headAttr = "";
      } else headAttr = ` transform="${pose(progress(ph, time))}"`;
      if (shaft) {
        // mask: the whole shaft in white, then an eraser riding on the very same
        // motion as the head blacks out everything ahead of its base — the reveal
        // front can't drift from the head, whatever the browser's path parametrisation
        const mw = f(2 * (sh + w1) + 0.1);
        mk = ` mask="url(#${id})"`;
        mask = `<mask id="${id}" maskUnits="userSpaceOnUse" x="-12" y="-12" width="24" height="24">`
          + `<path d="${dPath}" fill="none" stroke="#fff" stroke-width="${mw}" stroke-linejoin="round"/>`
          + `<g${headAttr}>${headAnim}<rect y="-12" width="24" height="24"/></g></mask>`;
      }
    }
    const headG = inner => `<g${headAttr}>${headAnim}${inner}</g>`;
    const shaftEl = (c, w) => !shaft ? ""
      : kind === "hook" ? `<path d="${shaft}" fill="none" stroke="${c}" stroke-width="${f3(swv + 2 * w)}"${mk}/>`
      : w ? `<path d="${shaft}" fill="none" stroke="${c}" stroke-width="${f3(2 * w)}" stroke-linejoin="round"${mk}/>`
      : `<path d="${shaft}" fill="${c}"${mk}/>`;
    // contours interleave shaft and head per level so the union reads like one outline
    inner.push(`<g data-i="${i}" transform="${pos}"><g transform="${loc}">${mask}`
      + rings.map(r => shaftEl(r.c, r.w)
        + headG(`<path d="${headRing}" fill="none" stroke="${r.c}" stroke-width="${f3(2 * r.w)}" stroke-linejoin="round"/>`)).join("")
      + shaftEl(p.color, 0) + headG(`<path d="${headFill}" fill="${p.color}"/>`)
      + `</g></g>`);
  }
  // z-order: persisted permutation, last = topmost; sanitize against count
  p.zorder = (p.zorder || []).filter(i => i < p.count);
  for (let i = 0; i < p.count; i++) if (!p.zorder.includes(i)) p.zorder.push(i);
  parts.push(...p.zorder.map(i => inner[i]));
  return {w: W, h: H, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${parts.join("")}</svg>`};
}

// ---------- render + export ----------
const stage = document.getElementById("stage");
const zoomEl = document.getElementById("zoom");
p.zoom = saved.zoom === "fit" || typeof saved.zoom === "number" ? saved.zoom : "fit";
let art;
const view = createZoom({
  stage, select: zoomEl, zoom: p.zoom,
  size: () => ({w: art.w, h: art.h}),
  onChange: z => { p.zoom = z; localStorage.setItem("arrow-poster", JSON.stringify(p)); },
});
function render() {
  localStorage.setItem("arrow-poster", JSON.stringify(p));
  art = makeSVG();
  stage.innerHTML = art.svg;
  for (const g of stage.querySelectorAll("g[data-i]")) g.style.cursor = "pointer";
  view.apply();
}
async function exportGIF(setLabel) {
  const scale = Math.min(1, p.gifpx / Math.max(art.w, art.h));
  const w = Math.round(art.w * scale), h = Math.round(art.h * scale);
  // one full cycle; draw-in also covers the stagger tail. static art = one frame
  const dur = p.motion === "none" ? 0 : p.speed * (p.motion === "draw loop" ? 1 : 1 + p.stagger / 100);
  const n = dur ? Math.max(1, Math.round(dur * p.fps)) : 1;
  const frames = [];
  try {
    for (let i = 0; i < n; i++) {
      setLabel(`… ${i + 1}/${n}`);
      await new Promise(r => setTimeout(r));           // let the label repaint
      frames.push(await rasterise(makeSVG(i / n * dur).svg, w, h));
    }
    setLabel("… encoding");
    await new Promise(r => setTimeout(r));
    const blob = encodeGIF(frames, {width: w, height: h, delay: Math.max(2, Math.round(100 / p.fps))});
    await saveAs(`arrows-${p.seed}.gif`, blob);
  } finally {
    render();                                          // restore the live SVG
  }
}
wireExport({
  SVG: () => saveAs(`arrows-${p.seed}.svg`, svgBlob(art.svg)),
  PNG: async () => saveAs(`arrows-${p.seed}.png`, await svgToPNG(art.svg, art.w, art.h)),
  GIF: exportGIF,
});
render();

// magic stick — click an arrow, it goes topmost
stage.addEventListener("click", e => {
  const g = e.target.closest("g[data-i]");
  if (!g || view.panning) return;
  const i = +g.dataset.i;
  p.zorder = p.zorder.filter(x => x !== i).concat(i);
  render();
});

// self-check: deterministic output for fixed params
console.assert(makeSVG().svg === makeSVG().svg, "generator must be deterministic");
</script>
</body>
</html>
